<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#138a5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CDN Planning">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Compagnie des Nuisibles</title>
  <style>
:root{
  --bg:#f6f8f7;--card:#fff;--ink:#10231b;--muted:#708078;--line:#e3ebe7;
  --green:#138a5b;--green-dark:#0c6843;--green-soft:#eaf7f1;--green-pale:#f4fbf7;
  --amber:#a86411;--red:#b42318;--shadow:0 10px 30px rgba(16,35,27,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brandline{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--green),var(--green-dark));display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:-.04em}
.brand{font-weight:850;font-size:1.03rem}
.muted{color:var(--muted);font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid var(--line);padding:6px;border-radius:15px;width:max-content;max-width:100%}
.nav button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;min-height:44px}
.nav button{background:transparent;color:var(--muted)}
.nav .active{background:var(--green-soft);color:var(--green-dark)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-soft{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:#fff1f0;border:1px solid #ffd5d2;color:var(--red)}
.grid{display:grid;gap:14px}.grid2{grid-template-columns:1fr 1fr}
.field{margin-bottom:14px}
label{display:block;font-weight:750;font-size:.84rem;margin-bottom:7px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:46px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#8bd0b3;box-shadow:0 0 0 3px var(--green-soft)}
textarea{min-height:112px;resize:vertical}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-bottom:14px}
.hero-main{background:linear-gradient(135deg,#0d6d47,#159566);color:#fff;border-radius:22px;padding:20px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.hero-main h2{margin:0;font-size:1.55rem}
.hero-main .muted{color:#d8f4e7}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}
.metric strong{display:block;font-size:1.65rem;line-height:1.1;margin-top:5px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.section-title h2{margin:0;font-size:1.12rem}
.appt{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;padding:15px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff}
.appt:hover{border-color:#cfe4da}
.time{font-weight:850;font-size:1rem;color:var(--green-dark)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1f5f3;color:#496258;font-size:.74rem;margin:7px 5px 0 0;font-weight:700}
.badge.green,.done{background:var(--green-soft);color:var(--green-dark)}
.todo{background:#fff6e9;color:var(--amber)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top right,#e8f7ef 0,transparent 35%),var(--bg)}
.login .card{width:min(460px,100%);padding:24px}
.login-head{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.notice{background:var(--green-pale);border:1px solid #d5eee2;color:var(--green-dark);padding:11px 12px;border-radius:12px;font-size:.84rem;margin-bottom:14px}
.report-head{background:linear-gradient(135deg,#f0faf5,#fff);border:1px solid #dbeee5;border-radius:18px;padding:16px;margin-bottom:16px}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.photo-box{border:1px dashed #b7d6c8;border-radius:16px;padding:14px;background:#fbfefc}
.photo-box input{border:0;padding:8px 0;min-height:auto}
.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.previews img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.followup{background:var(--green-pale);border:1px solid #cdebdc;border-radius:16px;padding:15px;margin:16px 0}
canvas{width:100%;height:190px;border:1px dashed #9cc8b4;border-radius:14px;background:#fff;touch-action:none}
.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pay-chip{background:#eef8f3;color:var(--green-dark)}
.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.view-switch{display:flex;gap:6px;flex-wrap:wrap;background:#f5f8f6;border:1px solid var(--line);padding:5px;border-radius:12px}
.view-switch button{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px;font-weight:750}
.view-switch button.active{background:#fff;color:var(--green-dark);box-shadow:0 2px 8px rgba(16,35,27,.06)}
.calendar-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.cal-head{font-size:.72rem;font-weight:800;color:var(--muted);padding:4px 5px;text-align:center}
.cal-day{min-height:92px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.cal-day:hover{border-color:#9fd1ba}.cal-day.today{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft) inset}.cal-day.out{opacity:.38}
.cal-num{font-weight:800;font-size:.84rem}.cal-events{display:flex;flex-direction:column;gap:4px}
.cal-event{font-size:.68rem;padding:4px 5px;border-radius:7px;background:var(--green-soft);color:var(--green-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-free{font-size:.67rem;color:#2f7a57;margin-top:auto}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow:auto;padding-bottom:4px}
.week-day{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;min-height:190px}
.week-day.today{border-color:var(--green)}.week-title{font-size:.78rem;font-weight:800;margin-bottom:8px}
.year-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mini-month{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.mini-month h3{font-size:.88rem;margin:0 0 8px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.mini-cell{font-size:.62rem;text-align:center;padding:4px 2px;border-radius:6px;cursor:pointer}.mini-cell.busy{background:var(--green-soft);color:var(--green-dark);font-weight:800}.mini-cell.out{opacity:.15}
.agenda-day-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.availability{font-size:.75rem;font-weight:750;color:var(--green-dark);background:var(--green-soft);padding:5px 8px;border-radius:999px}
@media(max-width:800px){
  .wrap{padding:12px}.grid2,.report-grid,.hero{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.year-grid{grid-template-columns:1fr 1fr}.cal-day{min-height:76px;padding:6px}.cal-event{font-size:.62rem}
  .appt{grid-template-columns:62px minmax(0,1fr)}.appt .actions{grid-column:1/-1}
  .nav{width:100%;overflow:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}
  .top{align-items:flex-start}.previews{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:430px){.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:1.35rem}.wrap{padding:9px}.card{padding:14px;border-radius:16px}.year-grid{grid-template-columns:1fr}.cal-grid{gap:3px}.cal-day{min-height:64px;padding:4px}.cal-event{display:none}.cal-head{font-size:.62rem}}

/* ===== V3 PREMIUM UI ===== */
:root{
  --bg:#f3f6f4;
  --card:rgba(255,255,255,.96);
  --ink:#10211a;
  --muted:#6d7b75;
  --line:#dde7e1;
  --green:#0f8a5f;
  --green-dark:#086341;
  --green-strong:#07543a;
  --green-soft:#e9f7f1;
  --green-pale:#f4fbf7;
  --amber:#9a6214;
  --red:#b42318;
  --shadow:0 14px 40px rgba(17,51,38,.07);
  --shadow-hover:0 18px 48px rgba(17,51,38,.11);
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 0 0,rgba(15,138,95,.08),transparent 27rem),
    radial-gradient(circle at 100% 10%,rgba(15,138,95,.045),transparent 24rem),
    linear-gradient(180deg,#f8faf9 0,#f2f6f4 100%);
  letter-spacing:-.01em;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:linear-gradient(rgba(18,73,52,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(18,73,52,.018) 1px,transparent 1px);
  background-size:28px 28px;
}
.wrap{max-width:1240px;padding:26px 28px 42px}
.top{
  position:sticky;top:12px;z-index:30;
  margin-bottom:20px;padding:12px 14px;
  border:1px solid rgba(216,229,222,.9);
  border-radius:19px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 8px 30px rgba(17,51,38,.06);
}
.brandline{gap:13px}
.logo{
  width:48px;height:48px;border-radius:15px;
  background:linear-gradient(145deg,#17a875 0,#0b704b 58%,#07553a 100%);
  box-shadow:0 8px 20px rgba(15,138,95,.24),inset 0 1px 0 rgba(255,255,255,.28);
  font-size:.95rem;
}
.brand{font-size:1.08rem;font-weight:900;letter-spacing:-.025em}
.top .muted{margin-top:2px}
.card{
  border:1px solid rgba(218,230,223,.95);
  border-radius:22px;
  padding:21px;
  box-shadow:var(--shadow);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card:hover{border-color:#cfe2d8}
.nav{
  position:sticky;top:88px;z-index:20;
  gap:5px;margin-bottom:20px;padding:6px;
  border-radius:16px;
  border:1px solid rgba(218,230,223,.95);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 7px 22px rgba(17,51,38,.05);
}
.nav button{
  padding:10px 14px;border-radius:11px;font-weight:800;font-size:.86rem;
  transition:all .18s ease;
}
.nav button:hover{background:#f4f8f6;color:var(--ink)}
.nav .active{
  color:#fff;
  background:linear-gradient(135deg,#149667,#0b724c);
  box-shadow:0 7px 17px rgba(15,138,95,.18);
}
.btn{
  border-radius:12px!important;
  font-weight:800!important;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{
  background:linear-gradient(135deg,#119669,#0b724c);
  box-shadow:0 7px 16px rgba(15,138,95,.18);
}
.btn-primary:hover{background:linear-gradient(135deg,#0e865d,#085f40);box-shadow:0 10px 20px rgba(15,138,95,.24)}
.btn-soft{background:linear-gradient(180deg,#fff,#fbfcfb);border-color:#d9e5df}
.btn-danger{background:#fff7f6}
.hero{gap:16px;margin-bottom:16px}
.hero-main{
  position:relative;overflow:hidden;
  min-height:172px;padding:24px;
  border-radius:25px;
  background:linear-gradient(135deg,#07563a 0%,#0e7d55 56%,#1aa877 100%);
  box-shadow:0 18px 42px rgba(9,101,68,.2);
}
.hero-main:after{
  content:"";position:absolute;width:230px;height:230px;border-radius:50%;
  right:-70px;top:-90px;background:rgba(255,255,255,.08);
  box-shadow:-80px 105px 0 rgba(255,255,255,.035);
}
.hero-main h2{font-size:1.8rem;letter-spacing:-.035em;position:relative;z-index:1}
.hero-main .muted{position:relative;z-index:1;color:#d7f4e7}
.metrics{gap:12px}
.metric{
  position:relative;overflow:hidden;
  border-radius:21px;padding:19px;
  box-shadow:0 10px 28px rgba(17,51,38,.055);
}
.metric:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(#18a474,#0d7650)
}
.metric strong{font-size:2rem;letter-spacing:-.04em;color:#0b6847}
.section-title h2,.card>h2{font-weight:900;letter-spacing:-.025em}
.appt{
  position:relative;
  grid-template-columns:84px minmax(0,1fr) auto;
  gap:16px;padding:17px 18px;
  border-radius:18px;
  border:1px solid #e1e9e5;
  box-shadow:0 5px 18px rgba(17,51,38,.035);
  transition:all .18s ease;
}
.appt:before{
  content:"";position:absolute;left:0;top:13px;bottom:13px;width:4px;border-radius:0 5px 5px 0;
  background:linear-gradient(#20aa78,#0f7b55)
}
.appt:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(17,51,38,.075);border-color:#cce0d6}
.time{font-size:1.06rem;letter-spacing:-.025em}
.badge{
  padding:6px 9px;border-radius:999px;
  background:#f3f6f4;border:1px solid #e8eeeb;
  font-size:.7rem;font-weight:800;
}
.badge.green,.done{background:#eaf8f2;border-color:#d5ecdf}
.todo{background:#fff8e9;border-color:#f4e6c4}
.pay-chip{background:#edf8f3;border-color:#d8ebe1}
.field{margin-bottom:16px}
label{font-size:.8rem;font-weight:850;color:#33473e;letter-spacing:.005em}
input,textarea,select{
  min-height:49px;padding:13px 14px;
  border-radius:13px;
  border:1px solid #dce6e1;
  background:#fcfdfc;
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
}
input:hover,textarea:hover,select:hover{border-color:#cbdad2;background:#fff}
input:focus,textarea:focus,select:focus{
  background:#fff;border-color:#61b794;
  box-shadow:0 0 0 4px rgba(15,138,95,.09);
}
textarea{min-height:126px}
.notice{
  border-radius:14px;padding:13px 14px;
  background:linear-gradient(180deg,#f3fbf7,#eef9f4);
  border-color:#d6ecdf;
}
.calendar-toolbar{
  padding:4px 0 15px;margin-bottom:15px;
  border-bottom:1px solid #edf1ef;
}
.view-switch{border-radius:13px;background:#f2f6f4;padding:4px}
.view-switch button{border-radius:9px;padding:9px 12px}
.view-switch button.active{color:#0a6948;box-shadow:0 3px 10px rgba(17,51,38,.08)}
.cal-day{
  min-height:102px;border-radius:15px;border-color:#e2eae6;padding:9px;
  transition:all .15s ease;
}
.cal-day:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(17,51,38,.06)}
.cal-day.today{border-color:#45aa83;box-shadow:0 0 0 3px rgba(15,138,95,.08) inset}
.cal-event{border-radius:8px;padding:5px 6px;font-weight:750}
.week-day,.mini-month{border-radius:16px;border-color:#e1eae5}
.availability{padding:7px 10px;border:1px solid #d8ecdf}
.report-head{
  position:relative;overflow:hidden;
  border-radius:23px;padding:22px;
  background:linear-gradient(135deg,#075d3f 0,#0d8258 65%,#17a876 100%);
  border:0;color:#fff;
  box-shadow:0 16px 38px rgba(11,111,75,.17);
}
.report-head:after{
  content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-55px;top:-72px;background:rgba(255,255,255,.09)
}
.report-head .muted{color:#d9f4e8}
.report-head h2{font-size:1.55rem;letter-spacing:-.035em}
.report-grid{gap:18px}
.photo-box{
  border:1px dashed #a9cdbd;border-radius:18px;padding:16px;
  background:linear-gradient(180deg,#fbfefc,#f6fbf8);
}
.previews img{border-radius:14px;box-shadow:0 5px 14px rgba(17,51,38,.07)}
.followup{
  border-radius:18px;padding:17px;
  background:linear-gradient(180deg,#f1faf6,#ebf7f1);
}
canvas{border-radius:16px;border-color:#a7cbb9;box-shadow:inset 0 0 0 1px rgba(15,138,95,.03)}
.login{
  background:
    radial-gradient(circle at 20% 5%,rgba(17,166,116,.14),transparent 30rem),
    radial-gradient(circle at 95% 95%,rgba(8,103,70,.1),transparent 25rem),
    linear-gradient(160deg,#f7faf8,#eef5f1);
}
.login .card{
  width:min(470px,100%);padding:30px;border-radius:27px;
  box-shadow:0 24px 70px rgba(17,51,38,.12);
}
.login-head{margin-bottom:22px}
.login .logo{width:54px;height:54px;border-radius:17px}
#logout{padding-inline:14px}
.actions{align-items:center}
@media(max-width:800px){
  .wrap{padding:10px 10px 28px}
  .top{top:6px;padding:10px;border-radius:16px;margin-bottom:12px}
  .logo{width:43px;height:43px;border-radius:13px}
  .brand{font-size:.98rem}
  .top .muted{font-size:.76rem}
  #logout{min-height:40px;padding:8px 10px;font-size:.78rem}
  .nav{top:72px;margin-bottom:13px;border-radius:14px;padding:5px}
  .nav button{min-height:40px;padding:9px 11px;font-size:.78rem}
  .hero-main{min-height:145px;padding:20px;border-radius:20px}
  .hero-main h2{font-size:1.45rem}
  .metric{padding:15px;border-radius:17px}
  .metric strong{font-size:1.55rem}
  .card{padding:15px;border-radius:18px}
  .appt{grid-template-columns:64px minmax(0,1fr);padding:14px 13px 14px 16px;border-radius:16px}
  .appt .actions{grid-column:1/-1;padding-top:4px}
  .appt .actions .btn{flex:1;min-width:110px}
  .report-head{padding:18px;border-radius:19px}
  .report-head h2{font-size:1.3rem}
}
@media(max-width:430px){
  .top{position:relative;top:auto}
  .nav{top:5px}
  .metrics{gap:8px}
  .cal-day{min-height:65px}
  .login .card{padding:22px}
}


/* ===== V4 CRM REBUILD ===== */
.v4-shell{max-width:1440px;margin:0 auto;padding:18px 20px 40px}
.v4-topbar{
  height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:16px;padding:0 16px;border:1px solid #dfe8e3;border-radius:20px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 10px 30px rgba(18,49,37,.06)
}
.v4-brand{display:flex;align-items:center;gap:12px;min-width:0}
.v4-brand-copy{min-width:0}
.v4-brand-title{font-size:1.04rem;font-weight:900;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4-brand-sub{font-size:.76rem;color:#718078;margin-top:2px}
.v4-userbox{display:flex;align-items:center;gap:10px}
.v4-role{
  padding:7px 10px;border-radius:999px;background:#edf8f3;border:1px solid #d7ebe1;
  color:#0b704c;font-size:.72rem;font-weight:850
}
.workspace{
  display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start
}
.sidebar{
  position:sticky;top:16px;padding:12px;border:1px solid #dfe8e3;border-radius:22px;
  background:rgba(255,255,255,.96);box-shadow:0 12px 34px rgba(18,49,37,.06)
}
.sidebar-head{
  padding:10px 10px 14px;margin-bottom:7px;border-bottom:1px solid #edf2ef
}
.sidebar-title{font-size:.7rem;color:#8a9891;font-weight:850;text-transform:uppercase;letter-spacing:.09em}
.nav{
  position:static!important;display:flex!important;flex-direction:column!important;gap:5px!important;
  width:100%!important;max-width:none!important;margin:0!important;padding:0!important;
  border:0!important;background:transparent!important;box-shadow:none!important;backdrop-filter:none!important
}
.nav button{
  width:100%;display:flex;align-items:center;gap:10px;justify-content:flex-start;
  min-height:46px;padding:0 12px!important;border-radius:12px!important;text-align:left
}
.nav-ico{
  width:30px;height:30px;display:grid;place-items:center;border-radius:9px;
  background:#f3f6f4;color:#52645b;font-size:.9rem;font-weight:900;flex:0 0 auto
}
.nav .active .nav-ico{background:rgba(255,255,255,.18);color:#fff}
.workspace-main{min-width:0}
.page-heading{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:2px 2px 14px
}
.page-heading h1{margin:0;font-size:1.55rem;letter-spacing:-.04em}
.page-heading p{margin:5px 0 0;color:#77847e;font-size:.84rem}
.crm-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:14px}
.crm-kpi{
  position:relative;overflow:hidden;padding:17px;border:1px solid #dfe8e3;border-radius:19px;
  background:#fff;box-shadow:0 8px 24px rgba(18,49,37,.045)
}
.crm-kpi:after{content:"";position:absolute;right:-22px;top:-28px;width:78px;height:78px;border-radius:50%;background:#f0f8f4}
.crm-kpi .kpi-label{position:relative;z-index:1;color:#738079;font-size:.72rem;font-weight:800}
.crm-kpi strong{position:relative;z-index:1;display:block;margin-top:8px;font-size:1.65rem;letter-spacing:-.045em}
.crm-kpi .kpi-foot{position:relative;z-index:1;margin-top:5px;color:#8a9690;font-size:.7rem}
.hero{display:none!important}
.calendar-card{padding:18px}
.agenda-day-head{padding:4px 2px 10px}
.appt{
  grid-template-columns:76px minmax(0,1fr) auto!important;
  padding:16px 16px 16px 19px!important;border-radius:18px!important;
  background:linear-gradient(180deg,#fff,#fdfefd)!important
}
.appt-main{min-width:0}
.appt-name{font-size:.98rem;font-weight:900;letter-spacing:-.02em}
.appt-address{margin-top:5px;color:#7a8781;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.amount-badge{background:#eff7ff!important;border-color:#dbe8f5!important;color:#25577a!important}
.time{padding-top:2px}
.time .time-start{font-size:1.05rem;font-weight:900}
.time .time-end{font-size:.73rem;margin-top:3px}
.actions .btn{min-height:40px;padding:9px 12px;font-size:.77rem}
.tech-dashboard{display:grid;gap:14px}
.tech-welcome{
  position:relative;overflow:hidden;padding:22px;border-radius:24px;
  background:linear-gradient(135deg,#084d35 0,#0c7450 58%,#18a877 100%);
  color:#fff;box-shadow:0 16px 38px rgba(9,94,64,.18)
}
.tech-welcome:after{content:"";position:absolute;right:-45px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.tech-welcome h1{position:relative;z-index:1;margin:4px 0 7px;font-size:1.55rem;letter-spacing:-.04em}
.tech-welcome p{position:relative;z-index:1;margin:0;color:#d8f3e8;font-size:.84rem}
.tech-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
.tech-stat{padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.14)}
.tech-stat span{display:block;font-size:.68rem;color:#daf3e8}
.tech-stat strong{display:block;margin-top:4px;font-size:1.2rem}
.login .card:before{
  content:"Espace professionnel";display:inline-block;margin-bottom:14px;padding:6px 9px;border-radius:999px;
  background:#ecf7f2;color:#0b714d;font-size:.68rem;font-weight:850;letter-spacing:.05em;text-transform:uppercase
}
@media(max-width:1050px){
  .workspace{grid-template-columns:190px minmax(0,1fr)}
  .crm-kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:800px){
  body{padding-bottom:78px}
  .v4-shell{padding:9px 9px 24px}
  .v4-topbar{height:auto;min-height:62px;margin-bottom:10px;padding:9px 10px;border-radius:16px}
  .v4-role{display:none}
  .workspace{display:block}
  .sidebar{
    position:fixed;left:8px;right:8px;bottom:8px;top:auto;z-index:100;
    padding:5px;border-radius:18px;box-shadow:0 12px 38px rgba(17,51,38,.16)
  }
  .sidebar-head{display:none}
  .nav{flex-direction:row!important;overflow-x:auto!important;gap:3px!important}
  .nav button{min-width:72px;flex:1;justify-content:center;flex-direction:column;gap:3px;padding:6px 8px!important;min-height:56px;font-size:.66rem}
  .nav-ico{width:24px;height:24px;background:transparent;font-size:.85rem}
  .nav .active{box-shadow:none!important}
  .nav .active .nav-ico{background:rgba(255,255,255,.16)}
  .page-heading{margin:3px 2px 10px}
  .page-heading h1{font-size:1.28rem}
  .page-heading p{font-size:.76rem}
  .crm-kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .crm-kpi{padding:13px;border-radius:16px}
  .crm-kpi strong{font-size:1.35rem}
  .calendar-card{padding:13px}
  .appt{grid-template-columns:58px minmax(0,1fr)!important;padding:13px 12px 13px 16px!important}
  .appt .actions{grid-column:1/-1}
  .appt-address{white-space:normal}
  .tech-welcome{padding:18px;border-radius:19px}
  .tech-stats{gap:7px}
  .tech-stat{padding:9px}
}
@media(max-width:430px){
  .crm-kpis{grid-template-columns:1fr 1fr}
  .v4-brand-title{font-size:.92rem}
  .v4-brand-sub{font-size:.7rem}
  .tech-welcome h1{font-size:1.3rem}
  .tech-stats{grid-template-columns:1fr 1fr 1fr}
}


.pdf-modal{position:fixed;inset:0;z-index:9999;background:rgba(8,24,18,.72);display:flex;align-items:center;justify-content:center;padding:18px}

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const SUPABASE_URL="https://fmfarfysmhddviezjwvp.supabase.co";
const SUPABASE_KEY="sb_publishable_uv7CV5zG_SLw8VTQKJCpsA_4A_dkgZU";

const today=()=>new Date().toISOString().slice(0,10);
const esc=(v="")=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let realtimeChannel=null;
let state={
 user:null,tab:"planning",date:today(),calendarView:"day",techFilter:"all",
 users:[],appts:[],
 company:{name:"Compagnie des Nuisibles",siret:"919 530 949 00016",address:"14 rue de Thionville, 75019 Paris",phone:"07 59 67 55 26",email:"compagniedesnuisibles@gmail.com",website:"compagniedesnuisibles.com"},lastCredentials:null,reportSaving:false

function dbToAppt(r){
 const tech=r.technician||{};
 return {
  id:r.id,date:r.intervention_date,start:String(r.start_time||"").slice(0,5),end:String(r.end_time||"").slice(0,5),

  passage:r.passage||1,parentId:r.parent_id||"",signaturePath:r.signature_path||"",photosBefore:[],photosAfter:[],signature:""
 };
}

 return {
  intervention_date:d.date,start_time:d.start,end_time:d.end,
  client_first_name:d.clientFirstName||"",client_last_name:d.clientLastName||d.client||"Client",
  client_phone:d.clientPhone||null,client_email:d.clientEmail||null,address:d.address,
  service_type:d.type,technician_id:u?.id||d.technicianId,notes:d.notes||null
 };
}
async function loadData(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){state.user=null;state.users=[];state.appts=[];return}
 const {data:me,error:meErr}=await sb.from("profiles").select("*").eq("id",user.id).single();
 if(meErr||!me||me.active!==true){await sb.auth.signOut();state.user=null;throw new Error("Compte désactivé ou non configuré.")}
 state.user=me;
 const [usersRes,companyRes,apptRes]=await Promise.all([
  sb.from("profiles").select("id,email,name,role,active").order("name"),
  sb.from("company_settings").select("*").eq("id",1).single(),
  sb.from("interventions").select("*, technician:profiles!interventions_technician_id_fkey(id,name,email)").order("intervention_date").order("start_time")
 ]);
 if(usersRes.error)throw usersRes.error;
 if(apptRes.error)throw apptRes.error;
 state.users=usersRes.data||[];
 if(companyRes.data)state.company=companyRes.data;
 state.appts=(apptRes.data||[]).map(dbToAppt)
}
function startRealtime(){
 if(realtimeChannel)sb.removeChannel(realtimeChannel);
 let timer=null;
 const refresh=()=>{clearTimeout(timer);timer=setTimeout(async()=>{try{await loadData();if(!state.reportSaving)render()}catch(e){console.error(e)}},250)};
 realtimeChannel=sb.channel("cdn-v5-live")
  .on("postgres_changes",{event:"*",schema:"public",table:"interventions"},refresh)
  .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},refresh)
  .subscribe()
}
async function initApp(){
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(session){
   await loadData();startRealtime();
   const qs=new URLSearchParams(location.search),reportId=qs.get("report"),pdfId=qs.get("pdf");
   if(reportId&&state.appts.some(a=>a.id===reportId)){await report(reportId);return}
   if(pdfId){
    const a=state.appts.find(x=>x.id===pdfId);
    if(a){
     try{
      await loadMedia(a);
      $("#app").innerHTML=shell("Rapport PDF",'<div class="card"><div class="muted">Préparation du rapport PDF…</div></div>');
      $("#logout").onclick=logout;
      const url=generateReportPdf(a,null,"view");
      openPdfModal(url,"Rapport · "+([a.clientFirstName,a.clientLastName].filter(Boolean).join(" ")||a.client||"Client"));
      return
     }catch(err){console.error(err);alert("PDF impossible : "+(err?.message||err))}
    }
   }
  }
 }catch(e){console.error(e)}
 render()
}
function shell(sub,body){
 const role=state.user?.role==="admin"?"Administrateur":"Technicien";
 return '<div class="v4-shell"><div class="v4-topbar"><div class="v4-brand"><div class="logo">CN</div><div class="v4-brand-copy"><div class="v4-brand-title">Compagnie des Nuisibles</div><div class="v4-brand-sub">'+esc(sub)+'</div></div></div><div class="v4-userbox"><span class="v4-role">'+role+'</span><button id="logout" class="btn btn-soft">Déconnexion</button></div></div>'+body+'</div>'
}
function render(){if(!state.user)return login();state.user.role==="admin"?admin():tech()}
function login(){
 $("#app").innerHTML='<div class="login"><div class="card"><div class="login-head"><div class="logo">CN</div><div><div class="brand" style="font-size:1.15rem">Compagnie des Nuisibles</div><div class="muted">V5 · Espace interventions synchronisé</div></div></div><form id="login"><div class="field"><label>E-mail professionnel</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Code d’accès</label><input name="code" type="password" minlength="6" required autocomplete="current-password" placeholder="6 caractères minimum"></div><button class="btn btn-primary" style="width:100%">Se connecter</button></form><div class="muted" style="margin-top:13px">Les rendez-vous et rapports sont maintenant synchronisés entre les appareils.</div></div></div>';
 $("#login").onsubmit=async e=>{
  e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const btn=e.currentTarget.querySelector("button");
  btn.disabled=true;btn.textContent="Connexion...";
  const {error}=await sb.auth.signInWithPassword({email:d.email.trim().toLowerCase(),password:d.code});
  if(error){btn.disabled=false;btn.textContent="Se connecter";return alert("Connexion impossible : "+error.message)}
  try{await loadData();startRealtime();render()}catch(err){alert(err.message);render()}
 };
}
function nav(){
 const items=[["planning","▦","Planning"],["new","+","Nouvelle intervention"],["history","↺","Historique"],["users","◉","Utilisateurs"],["company","⚙","Société"]];
 return '<div class="nav">'+items.map(x=>'<button data-tab="'+x[0]+'" class="'+(state.tab===x[0]?"active":"")+'"><span class="nav-ico">'+x[1]+'</span><span>'+x[2]+'</span></button>').join("")+'</div>'
}
function admin(){
 let page="";
 if(state.tab==="planning")page=planning();
 else if(state.tab==="new")page=form();
 else if(state.tab==="history")page=history();
 else if(state.tab==="users")page=usersView();
 else page=companyView();
 const titles={planning:["Tableau de bord","Pilotage des interventions et disponibilités de l’équipe."],new:["Nouvelle intervention","Crée une fiche client et assigne un technicien."],history:["Historique","Retrouve les interventions, rapports et PDF."],users:["Équipe","Gère les accès administrateurs et techniciens."],company:["Société","Informations utilisées sur les documents professionnels."]};
 const t=titles[state.tab]||titles.planning;
 const body='<div class="workspace"><aside class="sidebar"><div class="sidebar-head"><div class="sidebar-title">Navigation</div></div>'+nav()+'</aside><main class="workspace-main"><div class="page-heading"><div><h1>'+t[0]+'</h1><p>'+t[1]+'</p></div></div>'+page+'</main></div>';
 $("#app").innerHTML=shell("Centre de gestion",body);bindAdmin()
}
function planning(){
 const visible=filterCalendarTech(state.appts),dayList=visible.filter(a=>a.date===state.date).sort((a,b)=>a.start.localeCompare(b.start));
 const done=dayList.filter(a=>a.status==="done").length,todo=dayList.length-done;
 const followups=state.appts.filter(a=>(a.passage||1)===2&&a.status!=="done").length;
 const revenue=dayList.filter(a=>a.status==="done"&&a.amount).reduce((s,a)=>s+(Number(a.amount)||0),0);
 const techs=state.users.filter(u=>u.role==="tech"&&u.active);
 return '<div class="crm-kpis"><div class="crm-kpi"><div class="kpi-label">INTERVENTIONS DU JOUR</div><strong>'+dayList.length+'</strong><div class="kpi-foot">'+todo+' restante(s)</div></div><div class="crm-kpi"><div class="kpi-label">TERMINÉES</div><strong>'+done+'</strong><div class="kpi-foot">Rapports validés</div></div><div class="crm-kpi"><div class="kpi-label">2E PASSAGES</div><strong>'+followups+'</strong><div class="kpi-foot">À réaliser</div></div><div class="crm-kpi"><div class="kpi-label">CA DU JOUR</div><strong>'+revenue.toLocaleString("fr-FR")+' €</strong><div class="kpi-foot">Montants techniciens</div></div></div><div class="card calendar-card">'+calendarControls(techs,true)+calendarBody(visible,true)+'</div>'
}
function filterCalendarTech(list){return state.user?.role==="admin"&&state.techFilter!=="all"?list.filter(a=>a.techEmail===state.techFilter):list}
function calendarControls(techs,showFilter){
 const filter=showFilter?'<select id="techFilter" style="width:auto;min-width:190px"><option value="all">Tous les techniciens</option>'+techs.map(u=>'<option value="'+esc(u.email)+'" '+(state.techFilter===u.email?"selected":"")+'>'+esc(u.name)+'</option>').join("")+'</select>':"";
 return '<div class="calendar-toolbar"><div class="view-switch">'+["day","week","month","year"].map(v=>'<button type="button" data-cal-view="'+v+'" class="'+(state.calendarView===v?"active":"")+'">'+({day:"Jour",week:"Semaine",month:"Mois",year:"Année"}[v])+'</button>').join("")+'</div><div class="calendar-nav"><button class="btn btn-soft" type="button" id="calPrev">‹</button><button class="btn btn-soft" type="button" id="calToday">Aujourd’hui</button><button class="btn btn-soft" type="button" id="calNext">›</button><input id="calDate" type="date" value="'+state.date+'" style="width:auto">'+filter+'</div></div>'
}
function calendarBody(list,adminMode){
 if(state.calendarView==="day")return dayCalendar(list,adminMode);
 if(state.calendarView==="week")return weekCalendar(list,adminMode);
 if(state.calendarView==="month")return monthCalendar(list,adminMode);
 return yearCalendar(list)
}
function dateObj(s){const p=s.split("-").map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]))}
function dateStr(d){return d.toISOString().slice(0,10)}
function addDays(s,n){const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return dateStr(d)}
function startOfWeek(s){const d=dateObj(s),day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day);return dateStr(d)}
function monthInfo(s){const d=dateObj(s);return {y:d.getUTCFullYear(),m:d.getUTCMonth()}}
function fmtDay(s){return new Intl.DateTimeFormat("fr-FR",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}).format(dateObj(s))}
function fmtMonth(y,m){return new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,m,1)))}
function dayCalendar(list,adminMode){
 const day=list.filter(a=>a.date===state.date).sort((a,b)=>a.start.localeCompare(b.start));
 return '<div class="agenda-day-head"><div><h2 style="margin:0">'+fmtDay(state.date)+'</h2><div class="muted">'+day.length+' intervention(s)</div></div><span class="availability">'+(day.length===0?"Journée disponible":day.length<4?"Encore disponible":"Journée chargée")+'</span></div>'+(day.length?day.map(a=>card(a,adminMode)).join(""):'<div class="notice">Aucune intervention planifiée.</div>')
}
function weekCalendar(list,adminMode){
 const start=startOfWeek(state.date);let h='<div class="week-grid">';
 for(let i=0;i<7;i++){const d=addDays(start,i),items=list.filter(a=>a.date===d).sort((a,b)=>a.start.localeCompare(b.start));h+='<div class="week-day '+(d===today()?"today":"")+'" data-cal-date="'+d+'"><div class="week-title">'+fmtDay(d)+'</div>'+(items.length?items.map(a=>'<div class="cal-event">'+esc(a.start)+' · '+esc(a.client)+(adminMode?' · '+esc(a.technician):'')+'</div>').join(""):'<div class="cal-free">Disponible</div>')+'</div>'}return h+'</div>'
}
function monthCalendar(list,adminMode){
 const o=monthInfo(state.date),first=new Date(Date.UTC(o.y,o.m,1)),offset=(first.getUTCDay()+6)%7,start=new Date(Date.UTC(o.y,o.m,1-offset));
 const heads=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(x=>'<div class="cal-head">'+x+'</div>').join("");let cells="";
 for(let i=0;i<42;i++){const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const ds=dateStr(d),inM=d.getUTCMonth()===o.m,items=list.filter(a=>a.date===ds).sort((a,b)=>a.start.localeCompare(b.start));cells+='<div class="cal-day '+(!inM?"out ":"")+(ds===today()?"today":"")+'" data-cal-date="'+ds+'"><div class="cal-num">'+d.getUTCDate()+'</div><div class="cal-events">'+items.slice(0,3).map(a=>'<div class="cal-event">'+esc(a.start)+' '+esc(a.client)+(adminMode?' · '+esc(a.technician):'')+'</div>').join("")+'</div>'+(items.length===0&&inM?'<div class="cal-free">Disponible</div>':"")+'</div>'}return '<div class="section-title"><h2>'+fmtMonth(o.y,o.m)+'</h2></div><div class="cal-grid">'+heads+cells+'</div>'
}
function yearCalendar(list){
 const o=monthInfo(state.date);let h='<div class="year-grid">';
 for(let m=0;m<12;m++){const first=new Date(Date.UTC(o.y,m,1)),off=(first.getUTCDay()+6)%7,start=new Date(Date.UTC(o.y,m,1-off));let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const ds=dateStr(d),inM=d.getUTCMonth()===m,busy=list.some(a=>a.date===ds);cells+='<div class="mini-cell '+(!inM?"out ":"")+(busy&&inM?"busy":"")+'" data-cal-date="'+ds+'">'+d.getUTCDate()+'</div>'}h+='<div class="mini-month"><h3>'+fmtMonth(o.y,m).replace(" "+o.y,"")+'</h3><div class="mini-grid">'+cells+'</div></div>'}return h+'</div>'
}
function card(a,adminMode){
 const full=[a.clientFirstName,a.clientLastName].filter(Boolean).join(" ")||a.client||"Client",pdf=a.status==="done"?'<button class="btn btn-soft" data-pdf="'+a.id+'">Voir PDF</button>':"",amt=a.amount?'<span class="badge amount-badge">'+Number(a.amount).toLocaleString("fr-FR")+' € TTC</span>':"";

function shiftPeriod(s,dir,view){const d=dateObj(s);if(view==="day")d.setUTCDate(d.getUTCDate()+dir);else if(view==="week")d.setUTCDate(d.getUTCDate()+7*dir);else if(view==="month")d.setUTCMonth(d.getUTCMonth()+dir);else d.setUTCFullYear(d.getUTCFullYear()+dir);return dateStr(d)}

async function urlToDataUrl(url){
 const res=await fetch(url);if(!res.ok)throw new Error("Impossible de charger un média du rapport");
 const blob=await res.blob();return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})
}
async function loadMedia(a){
 const {data,error}=await sb.from("intervention_media").select("*").eq("intervention_id",a.id);
 if(error)throw error;
 a.photosBefore=[];a.photosAfter=[];a.signature="";
 for(const m of data||[]){
  const {data:s}=await sb.storage.from("intervention-media").createSignedUrl(m.storage_path,3600);
  if(!s?.signedUrl)continue;
  let src=s.signedUrl;
  try{src=await urlToDataUrl(src)}catch(_){}
  if(m.kind==="before")a.photosBefore.push(src);
  else if(m.kind==="after")a.photosAfter.push(src);
  else a.signature=src
 }
}
async function report(id){
 const a=state.appts.find(x=>x.id===id);if(!a)return;try{await loadMedia(a)}catch(e){console.error(e)}
 const passage=a.passage||1,before=a.photosBefore||[],after=a.photosAfter||[];
 $("#app").innerHTML=shell("Rapport technicien",'<div class="report-head"><div class="muted">INTERVENTION · PASSAGE '+passage+'</div><h2 style="margin:5px 0 6px">'+esc([a.clientFirstName,a.clientLastName].filter(Boolean).join(" ")||a.client)+'</h2><div>'+esc(a.type)+' · '+esc(a.date)+' · '+esc(a.start)+'-'+esc(a.end)+'</div><div class="muted" style="margin-top:5px">'+esc(a.address)+(a.clientPhone?' · '+esc(a.clientPhone):"")+'</div></div><div class="card"><form id="reportForm"><div class="report-grid"><div><div class="field"><label>Montant de l’intervention TTC (€)</label><input id="amount" type="number" min="0" step="0.01" value="'+esc(a.amount||"")+'"></div><div class="field"><label>Mode de paiement</label><select id="payment"><option value="">Choisir</option>'+["Carte bancaire","Espèces","Virement","Chèque","Non payé"].map(v=>'<option '+(a.payment===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>Rapport d’intervention</label><textarea id="reportText" required>'+esc(a.report||"")+'</textarea></div></div><div><div class="photo-box"><label>Photos avant</label><input id="photosBefore" type="file" accept="image/*" multiple><div id="beforePreview" class="previews">'+before.map(src=>'<img src="'+src+'">').join("")+'</div></div><div class="photo-box" style="margin-top:12px"><label>Photos après</label><input id="photosAfter" type="file" accept="image/*" multiple><div id="afterPreview" class="previews">'+after.map(src=>'<img src="'+src+'">').join("")+'</div></div></div></div>'+(passage===1?'<div class="followup"><label style="display:flex;align-items:center;gap:10px"><input id="needSecond" type="checkbox" style="width:22px;height:22px;min-height:auto"> Programmer un 2e passage</label><div id="secondFields" style="display:none;margin-top:14px"><div class="grid grid2"><div class="field"><label>Date</label><input id="secondDate" type="date" min="'+today()+'"></div><div class="field"><label>Heure</label><input id="secondTime" type="time" value="'+esc(a.start)+'"></div></div></div></div>':"")+'<div class="field"><label>Signature du client</label><canvas id="sig"></canvas><button id="clearSig" type="button" class="btn btn-soft" style="margin-top:8px">Effacer</button></div><div class="notice">Le rapport, les photos et la signature sont sauvegardés dans la V5.</div><div class="actions"><button id="validateReport" type="button" class="btn btn-primary">Valider le rapport</button><button id="back" type="button" class="btn btn-soft">Retour</button></div></form></div>');
 $("#logout").onclick=logout;$("#back").onclick=render;setupSig(a.signature);
 let newBefore=null,newAfter=null;bindPhotoInput("#photosBefore","#beforePreview",x=>newBefore=x);bindPhotoInput("#photosAfter","#afterPreview",x=>newAfter=x);
 if($("#needSecond"))$("#needSecond").onchange=e=>{$("#secondFields").style.display=e.target.checked?"block":"none";$("#secondDate").required=e.target.checked;$("#secondTime").required=e.target.checked};
 $("#validateReport").onclick=async()=>{
  const btn=$("#validateReport");
  const reportText=$("#reportText").value.trim(),amount=$("#amount").value||"",payment=$("#payment").value||"";
  if(!reportText){alert("Renseigne le rapport d’intervention.");$("#reportText").focus();return}
  if($("#needSecond")?.checked&&(!$("#secondDate").value||!$("#secondTime").value)){alert("Renseigne la date et l’heure du 2e passage.");return}
  const sig=$("#sig").toDataURL("image/png");
  state.reportSaving=true;
  btn.disabled=true;btn.textContent="Validation...";
  try{
   const {data:updated,error}=await sb.rpc("complete_intervention",{
    p_intervention_id:a.id,
    p_report:reportText,
    p_amount:amount?Number(amount):null,
    p_payment:payment||null
   });
   if(error)throw error;
   const saved=Array.isArray(updated)?updated[0]:updated;
   if(!saved||saved.status!=="done")throw new Error("Le rapport n’a pas pu être validé.");

   const mediaErrors=[];
   if(newBefore){try{await replaceMedia(a.id,"before",newBefore)}catch(e){console.error(e);mediaErrors.push("photos avant")}}
   if(newAfter){try{await replaceMedia(a.id,"after",newAfter)}catch(e){console.error(e);mediaErrors.push("photos après")}}
   try{await replaceMedia(a.id,"signature",[sig])}catch(e){console.error(e);mediaErrors.push("signature")}

   if(passage===1&&$("#needSecond")?.checked){
    const d=$("#secondDate").value,t=$("#secondTime").value;
    const {error:e2}=await sb.rpc("schedule_second_passage",{p_parent_id:a.id,p_date:d,p_start:t});
    if(e2)throw e2
   }

   await loadData();
   state.reportSaving=false;
   alert(mediaErrors.length?"Rapport validé. La fiche est terminée, mais certains médias n’ont pas pu être enregistrés : "+mediaErrors.join(", "):"Rapport validé. La fiche client est terminée.");
   state.date=a.date;render()
  }catch(err){
   state.reportSaving=false;
   console.error(err);
   btn.disabled=false;btn.textContent="Valider le rapport";
   alert("Validation impossible : "+(err?.message||err));
  }
 }}

async function replaceMedia(interventionId,kind,dataUrls){
 const {data:old}=await sb.from("intervention_media").select("id,storage_path").eq("intervention_id",interventionId).eq("kind",kind);
 if(old?.length){await sb.storage.from("intervention-media").remove(old.map(x=>x.storage_path));await sb.from("intervention_media").delete().in("id",old.map(x=>x.id))}
 for(let i=0;i<dataUrls.length;i++){
  if(!String(dataUrls[i]).startsWith("data:"))continue;
  const blob=await (await fetch(dataUrls[i])).blob(),ext=blob.type.includes("png")?"png":"jpg",path=interventionId+"/"+kind+"-"+crypto.randomUUID()+"."+ext;
  const {error:upErr}=await sb.storage.from("intervention-media").upload(path,blob,{contentType:blob.type,upsert:false});if(upErr)throw upErr;
  const {error:dbErr}=await sb.from("intervention_media").insert({intervention_id:interventionId,kind,storage_path:path});if(dbErr)throw dbErr
 }
}
function bindPhotoInput(inputSel,previewSel,setter){
 const input=$(inputSel),preview=$(previewSel);if(!input)return;
 input.onchange=async()=>{const arr=[];for(const file of [...input.files].slice(0,3))arr.push(await compressImage(file,900,.68));setter(arr);preview.innerHTML=arr.map(src=>'<img src="'+src+'">').join("")}
}
function compressImage(file,maxSize=900,quality=.68){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxSize||h>maxSize){const k=Math.min(maxSize/w,maxSize/h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);resolve(c.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function addHour(t){const p=t.split(":").map(Number);return String((p[0]+1)%24).padStart(2,"0")+":"+String(p[1]).padStart(2,"0")}
function setupSig(existing){const c=$("#sig"),ctx=c.getContext("2d"),r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap="round";if(existing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=existing}let d=false;const p=e=>{const q=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-q.left,t.clientY-q.top]},st=e=>{d=true;const q=p(e);ctx.beginPath();ctx.moveTo(q[0],q[1]);e.preventDefault()},mv=e=>{if(!d)return;const q=p(e);ctx.lineTo(q[0],q[1]);ctx.stroke();e.preventDefault()},sp=()=>d=false;c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",sp);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",sp);$("#clearSig").onclick=()=>ctx.clearRect(0,0,r.width,r.height)}
function closePdfModal(){
 const m=$("#pdfModal");if(!m)return;
 const url=m.dataset.url;if(url)URL.revokeObjectURL(url);
 m.remove()
}
function openPdfModal(url,title){
 closePdfModal();
 const m=document.createElement("div");m.className="pdf-modal";m.id="pdfModal";m.dataset.url=url;
 m.innerHTML='<div class="pdf-modal-card"><div class="pdf-modal-head"><div class="pdf-modal-title">'+esc(title||"Rapport PDF")+'</div><div class="pdf-modal-actions"><a class="btn btn-primary" id="downloadPdf" href="'+url+'" download="rapport.pdf">Télécharger</a><button type="button" class="btn btn-soft" id="closePdf">Fermer</button></div></div><iframe class="pdf-frame" src="'+url+'#toolbar=1"></iframe></div>';
 document.body.appendChild(m);
 $("#closePdf").onclick=closePdfModal;
 m.onclick=e=>{if(e.target===m)closePdfModal()}
}
function bindPdfButtons(){
 $$("[data-pdf]").forEach(b=>b.onclick=async e=>{
  e.stopPropagation();
  const a=state.appts.find(x=>x.id===b.dataset.pdf);if(!a)return;
  const old=b.textContent;b.disabled=true;b.textContent="Chargement...";
  try{
   await loadMedia(a);
   const url=generateReportPdf(a,null,"view");
   const title="Rapport · "+([a.clientFirstName,a.clientLastName].filter(Boolean).join(" ")||a.client||"Client");
   openPdfModal(url,title)
  }catch(err){
   console.error(err);
   alert("PDF impossible : "+(err?.message||err))
  }finally{
   b.disabled=false;b.textContent=old
  }
 }
)}
function safeFileName(v="rapport"){return String(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9_-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60)||"rapport"}
function generateReportPdf(a,secondVisit=null,mode="download"){
 if(!window.jspdf?.jsPDF)throw new Error("jsPDF indisponible");const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),pageW=210,margin=16,contentW=178;let y=18;const green=[19,138,91],dark=[16,35,27],muted=[101,117,110],light=[241,248,245];
 const ensure=n=>{if(y+(n||12)>280){doc.addPage();y=18}},lv=(l,v)=>{if(v===undefined||v===null||String(v).trim()==="")return;ensure(10);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(l.toUpperCase(),margin,y);doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(...dark);const lines=doc.splitTextToSize(String(v),112);doc.text(lines,81,y);y+=Math.max(8,lines.length*5.2)},sec=t=>{ensure(14);y+=2;doc.setFillColor(...light);doc.roundedRect(margin,y-5,contentW,10,2,2,"F");doc.setTextColor(...green);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(t.toUpperCase(),margin+4,y+1.5);y+=11};
 const company=state.company||{},full=[a.clientFirstName,a.clientLastName].filter(Boolean).join(" ")||a.client||"Client";doc.setFillColor(...green);doc.roundedRect(margin,12,contentW,36,3,3,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text((company.name||"Compagnie des Nuisibles").toUpperCase(),margin+6,23);doc.setFont("helvetica","normal");doc.setFontSize(8.5);const l1=[company.siret?"SIRET "+company.siret:"",company.phone||"",company.email||""].filter(Boolean).join(" · ");if(l1)doc.text(l1,margin+6,30,{maxWidth:145});const l2=[company.address||"",company.website||""].filter(Boolean).join(" · ");if(l2)doc.text(l2,margin+6,36,{maxWidth:145});doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("RAPPORT · PASSAGE "+(a.passage||1),pageW-margin-6,39,{align:"right"});y=57;
 sec("Fiche client");lv("Nom",a.clientLastName||a.client);lv("Prénom",a.clientFirstName);lv("Téléphone",a.clientPhone);lv("E-mail",a.clientEmail);lv("Adresse",a.address);lv("Informations / consignes",a.notes);
 sec("Intervention");lv("Prestation",a.type);lv("Date / horaire",a.date+" · "+a.start+" - "+a.end);lv("Technicien",a.technician);lv("Montant TTC",a.amount?Number(a.amount).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €":"Non renseigné");lv("Paiement",a.payment||"Non renseigné");
 sec("Rapport technicien");doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(...dark);for(const line of doc.splitTextToSize(a.report||"Aucune observation renseignée.",contentW)){ensure(6);doc.text(line,margin,y);y+=5.5}y+=3;
 const photos=(title,arr)=>{if(!arr?.length)return;sec(title);const gap=5,w=(contentW-gap)/2,h=58;arr.forEach((src,i)=>{if(i%2===0)ensure(h+8);const x=margin+(i%2)*(w+gap);try{doc.addImage(src,"JPEG",x,y,w,h,undefined,"FAST")}catch(_){try{doc.addImage(src,"PNG",x,y,w,h,undefined,"FAST")}catch(__){}}if(i%2===1||i===arr.length-1)y+=h+6})};photos("Photos avant intervention",a.photosBefore);photos("Photos après intervention",a.photosAfter);
 if(a.signature){sec("Signature client");ensure(38);doc.setDrawColor(210,225,218);doc.roundedRect(margin,y,90,32,2,2,"S");try{doc.addImage(a.signature,"PNG",margin+3,y+3,84,26,undefined,"FAST")}catch(_){}y+=39}
 ensure(18);doc.setDrawColor(225,233,229);doc.line(margin,y,pageW-margin,y);y+=6;doc.setFontSize(8.5);doc.setTextColor(...muted);doc.text("Document généré depuis Compagnie des Nuisibles.",margin,y);doc.text("Généré le "+new Date().toLocaleDateString("fr-FR"),pageW-margin,y,{align:"right"});const total=doc.getNumberOfPages();for(let i=1;i<=total;i++){doc.setPage(i);doc.setFontSize(8);doc.text("Page "+i+" / "+total,pageW-margin,292,{align:"right"})}const filename="Rapport_"+safeFileName(full)+"_"+a.date+".pdf";if(mode==="view"){const blob=doc.output("blob");return URL.createObjectURL(blob)}doc.save(filename);return null
}
