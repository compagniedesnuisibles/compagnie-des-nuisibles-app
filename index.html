<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <style>
:root{
  --bg:#f6f8f7;--card:#fff;--ink:#10231b;--muted:#708078;--line:#e3ebe7;
  --green:#138a5b;--green-dark:#0c6843;--green-soft:#eaf7f1;--green-pale:#f4fbf7;
  --amber:#a86411;--red:#b42318;--shadow:0 10px 30px rgba(16,35,27,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brandline{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--green),var(--green-dark));display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:-.04em}
.brand{font-weight:850;font-size:1.03rem}
.muted{color:var(--muted);font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid var(--line);padding:6px;border-radius:15px;width:max-content;max-width:100%}
.nav button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;min-height:44px}
.nav button{background:transparent;color:var(--muted)}
.nav .active{background:var(--green-soft);color:var(--green-dark)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-soft{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:#fff1f0;border:1px solid #ffd5d2;color:var(--red)}
.grid{display:grid;gap:14px}.grid2{grid-template-columns:1fr 1fr}
.field{margin-bottom:14px}
label{display:block;font-weight:750;font-size:.84rem;margin-bottom:7px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:46px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#8bd0b3;box-shadow:0 0 0 3px var(--green-soft)}
textarea{min-height:112px;resize:vertical}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-bottom:14px}
.hero-main{background:linear-gradient(135deg,#0d6d47,#159566);color:#fff;border-radius:22px;padding:20px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.hero-main h2{margin:0;font-size:1.55rem}
.hero-main .muted{color:#d8f4e7}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}
.metric strong{display:block;font-size:1.65rem;line-height:1.1;margin-top:5px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.section-title h2{margin:0;font-size:1.12rem}
.appt{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;padding:15px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff}
.appt:hover{border-color:#cfe4da}
.time{font-weight:850;font-size:1rem;color:var(--green-dark)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1f5f3;color:#496258;font-size:.74rem;margin:7px 5px 0 0;font-weight:700}
.badge.green,.done{background:var(--green-soft);color:var(--green-dark)}
.todo{background:#fff6e9;color:var(--amber)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top right,#e8f7ef 0,transparent 35%),var(--bg)}
.login .card{width:min(460px,100%);padding:24px}
.login-head{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.notice{background:var(--green-pale);border:1px solid #d5eee2;color:var(--green-dark);padding:11px 12px;border-radius:12px;font-size:.84rem;margin-bottom:14px}
.report-head{background:linear-gradient(135deg,#f0faf5,#fff);border:1px solid #dbeee5;border-radius:18px;padding:16px;margin-bottom:16px}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.photo-box{border:1px dashed #b7d6c8;border-radius:16px;padding:14px;background:#fbfefc}
.photo-box input{border:0;padding:8px 0;min-height:auto}
.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.previews img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.followup{background:var(--green-pale);border:1px solid #cdebdc;border-radius:16px;padding:15px;margin:16px 0}
canvas{width:100%;height:190px;border:1px dashed #9cc8b4;border-radius:14px;background:#fff;touch-action:none}
.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pay-chip{background:#eef8f3;color:var(--green-dark)}
.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.view-switch{display:flex;gap:6px;flex-wrap:wrap;background:#f5f8f6;border:1px solid var(--line);padding:5px;border-radius:12px}
.view-switch button{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px;font-weight:750}
.view-switch button.active{background:#fff;color:var(--green-dark);box-shadow:0 2px 8px rgba(16,35,27,.06)}
.calendar-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.cal-head{font-size:.72rem;font-weight:800;color:var(--muted);padding:4px 5px;text-align:center}
.cal-day{min-height:92px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.cal-day:hover{border-color:#9fd1ba}.cal-day.today{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft) inset}.cal-day.out{opacity:.38}
.cal-num{font-weight:800;font-size:.84rem}.cal-events{display:flex;flex-direction:column;gap:4px}
.cal-event{font-size:.68rem;padding:4px 5px;border-radius:7px;background:var(--green-soft);color:var(--green-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-free{font-size:.67rem;color:#2f7a57;margin-top:auto}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow:auto;padding-bottom:4px}
.week-day{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;min-height:190px}
.week-day.today{border-color:var(--green)}.week-title{font-size:.78rem;font-weight:800;margin-bottom:8px}
.year-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mini-month{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.mini-month h3{font-size:.88rem;margin:0 0 8px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.mini-cell{font-size:.62rem;text-align:center;padding:4px 2px;border-radius:6px;cursor:pointer}.mini-cell.busy{background:var(--green-soft);color:var(--green-dark);font-weight:800}.mini-cell.out{opacity:.15}
.agenda-day-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.availability{font-size:.75rem;font-weight:750;color:var(--green-dark);background:var(--green-soft);padding:5px 8px;border-radius:999px}
@media(max-width:800px){
  .wrap{padding:12px}.grid2,.report-grid,.hero{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.year-grid{grid-template-columns:1fr 1fr}.cal-day{min-height:76px;padding:6px}.cal-event{font-size:.62rem}
  .appt{grid-template-columns:62px minmax(0,1fr)}.appt .actions{grid-column:1/-1}
  .nav{width:100%;overflow:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}
  .top{align-items:flex-start}.previews{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:430px){.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:1.35rem}.wrap{padding:9px}.card{padding:14px;border-radius:16px}.year-grid{grid-template-columns:1fr}.cal-grid{gap:3px}.cal-day{min-height:64px;padding:4px}.cal-event{display:none}.cal-head{font-size:.62rem}}

.btn:hover{transform:translateY(-1px)}

}

.section-title h2,.card>h2{font-weight:900;letter-spacing:-.025em}

.todo{background:#fff8e9;border-color:#f4e6c4}
.pay-chip{background:#edf8f3;border-color:#d8ebe1}
.field{margin-bottom:16px}
label{font-size:.8rem;font-weight:850;color:#33473e;letter-spacing:.005em}

}
textarea{min-height:126px}
.notice{

function dateObj(s){const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))}
function dateStr(d){return d.toISOString().slice(0,10)}
function addDays(s,n){const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return dateStr(d)}
function startOfWeek(s){const d=dateObj(s),day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day);return dateStr(d)}
function monthInfo(s){const d=dateObj(s);return {y:d.getUTCFullYear(),m:d.getUTCMonth()}}
function fmtDay(s){return new Intl.DateTimeFormat("fr-FR",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}).format(dateObj(s))}
function fmtMonth(y,m){return new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,m,1)))}
function dayCalendar(list,adminMode){
 const day=list.filter(a=>a.date===state.date).sort((a,b)=>a.start.localeCompare(b.start));

}
function weekCalendar(list,adminMode){

 return html+'</div>'

function monthCalendar(list,adminMode){
 const {y,m}=monthInfo(state.date), first=new Date(Date.UTC(y,m,1)), offset=(first.getUTCDay()+6)%7, start=new Date(Date.UTC(y,m,1-offset));

 let cells="";
 for(let i=0;i<42;i++){const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const ds=dateStr(d),inMonth=d.getUTCMonth()===m,items=list.filter(a=>a.date===ds).sort((a,b)=>a.start.localeCompare(b.start));cells+='<div class="cal-day '+(!inMonth?"out ":"")+(ds===today()?"today":"")+'" data-cal-date="'+ds+'"><div class="cal-num">'+d.getUTCDate()+'</div><div class="cal-events">'+items.slice(0,3).map(a=>'<div class="cal-event">'+esc(a.start)+' '+esc(a.client)+(adminMode?' · '+esc(a.technician):'')+'</div>').join("")+'</div>'+(items.length===0&&inMonth?'<div class="cal-free">Disponible</div>':'')+(items.length>3?'<div class="muted">+'+(items.length-3)+'</div>':'')+'</div>'}
 return '<div class="section-title"><div><h2>'+fmtMonth(y,m)+'</h2><div class="muted">Clique sur un jour pour ouvrir son planning</div></div></div><div class="cal-grid">'+heads+cells+'</div>'
}
function yearCalendar(list){

function shiftPeriod(s,dir,view){
 const d=dateObj(s);
 if(view==="day")d.setUTCDate(d.getUTCDate()+dir);
 else if(view==="week")d.setUTCDate(d.getUTCDate()+7*dir);

 return dateStr(d)

 '<div class="report-head"><div class="muted">INTERVENTION · PASSAGE '+passage+'</div><h2 style="margin:5px 0 6px">'+esc([a.clientFirstName,a.clientLastName].filter(Boolean).join(" ")||a.client)+'</h2><div>'+esc(a.type)+' · '+esc(a.date)+' · '+esc(a.start)+'-'+esc(a.end)+'</div><div class="muted" style="margin-top:5px">'+esc(a.address)+(a.clientPhone?' · '+esc(a.clientPhone):'')+(a.clientEmail?' · '+esc(a.clientEmail):'')+'</div></div>'+

 '<div class="report-grid"><div><div class="field"><label>Montant de l’intervention TTC (€)</label><input id="amount" type="number" min="0" step="0.01" value="'+esc(a.amount||"")+'" placeholder="Ex. 350"></div><div class="field"><label>Mode de paiement</label><select id="payment"><option value="">Choisir</option>'+["Carte bancaire","Espèces","Virement","Chèque","Non payé"].map(v=>'<option '+(a.payment===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>Rapport d’intervention</label><textarea id="reportText" required placeholder="Travaux réalisés, observations, recommandations...">'+esc(a.report||"")+'</textarea></div></div>'+
 '<div><div class="photo-box"><label>Photos avant intervention</label><input id="photosBefore" type="file" accept="image/*" multiple><div class="muted">Maximum 3 photos.</div><div id="beforePreview" class="previews">'+before.map(src=>'<img src="'+src+'" alt="Photo avant">').join("")+'</div></div><div class="photo-box" style="margin-top:12px"><label>Photos après intervention</label><input id="photosAfter" type="file" accept="image/*" multiple><div class="muted">Maximum 3 photos.</div><div id="afterPreview" class="previews">'+after.map(src=>'<img src="'+src+'" alt="Photo après">').join("")+'</div></div></div></div>'+
 (passage===1?'<div class="followup"><label style="display:flex;align-items:center;gap:10px;font-size:.95rem"><input id="needSecond" type="checkbox" style="width:22px;height:22px;min-height:auto;accent-color:var(--green)"> Programmer un 2e passage</label><div id="secondFields" style="display:none;margin-top:14px"><div class="grid grid2"><div class="field"><label>Date du 2e passage</label><input id="secondDate" type="date" min="'+today()+'"></div><div class="field"><label>Heure du 2e passage</label><input id="secondTime" type="time" value="'+esc(a.start)+'"></div></div><div class="muted">Une fois le rapport validé, ce 2e passage sera ajouté automatiquement au planning du technicien.</div></div></div>':'')+
 '<div class="field"><label>Signature du client</label><canvas id="sig"></canvas><button id="clearSig" type="button" class="btn btn-soft" style="margin-top:8px">Effacer la signature</button></div>'+
 '<div class="notice" style="margin-top:14px">À la validation, le rapport est enregistré et un PDF professionnel est généré automatiquement.</div>'+
 '<div class="actions"><button class="btn btn-primary">Valider le rapport</button><button id="back" type="button" class="btn btn-soft">Retour</button></div></form></div>');
 $("#logout").onclick=()=>{state.user=null;render()};$("#back").onclick=render;setupSig(a.signature);
 let nextBefore=[...before], nextAfter=[...after];
 bindPhotoInput("#photosBefore","#beforePreview",arr=>nextBefore=arr,nextBefore);
 bindPhotoInput("#photosAfter","#afterPreview",arr=>nextAfter=arr,nextAfter);
 if($("#needSecond"))$("#needSecond").onchange=e=>{const yes=e.target.checked;$("#secondFields").style.display=yes?"block":"none";$("#secondDate").required=yes;$("#secondTime").required=yes};
 $("#reportForm").onsubmit=async e=>{
   e.preventDefault();
   const submitBtn=e.currentTarget.querySelector('button[type="submit"]');
   if(submitBtn){submitBtn.disabled=true;submitBtn.textContent="Génération du PDF..."}
   a.report=$("#reportText").value.trim();a.amount=$("#amount").value;a.payment=$("#payment").value;a.signature=$("#sig").toDataURL("image/png");a.status="done";a.photosBefore=nextBefore;a.photosAfter=nextAfter;
   let secondVisit=null;
   if(passage===1 && $("#needSecond")?.checked){
     const d=$("#secondDate").value,t=$("#secondTime").value;
     if(!d||!t){if(submitBtn){submitBtn.disabled=false;submitBtn.textContent="Valider le rapport"}return alert("Choisis la date et l’heure du deuxième passage.")}
     secondVisit={date:d,time:t};
     const exists=state.appts.some(x=>x.parentId===a.id&&x.passage===2);
     if(!exists){
       state.appts.push({id:crypto.randomUUID(),date:d,start:t,end:addHour(t),client:a.client,clientFirstName:a.clientFirstName||"",clientLastName:a.clientLastName||"",clientPhone:a.clientPhone||"",clientEmail:a.clientEmail||"",address:a.address,amount:"",type:a.type,technician:a.technician,techEmail:a.techEmail,notes:"Deuxième passage programmé par le technicien depuis le rapport du passage 1.",status:"todo",report:"",signature:"",payment:"",photosBefore:[],photosAfter:[],passage:2,parentId:a.id});
     }
   }
   try{save()}catch(err){if(submitBtn){submitBtn.disabled=false;submitBtn.textContent="Valider le rapport"}return alert("Les photos sont trop lourdes. Choisis moins de photos.")}
   try{
     generateReportPdf(a,secondVisit);
     alert("Rapport enregistré et PDF généré"+(secondVisit?" · deuxième passage ajouté au planning.":"."));
   }catch(err){
     console.error(err);
     alert("Rapport enregistré, mais le PDF n’a pas pu être généré. Recharge la page et réessaie.");
   }
   render()
 }}

function bindPdfButtons(){
 $$("[data-pdf]").forEach(b=>b.onclick=e=>{
   e.stopPropagation();
   const a=state.appts.find(x=>x.id===b.dataset.pdf);
   if(a)generateReportPdf(a,null)
 })
}
function safeFileName(v="rapport"){
 return String(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9_-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60)||"rapport"
}
function generateReportPdf(a,secondVisit=null){
 if(!window.jspdf?.jsPDF)throw new Error("jsPDF indisponible");
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF({unit:"mm",format:"a4"});
 const pageW=210,margin=16,contentW=178;
 let y=18;
 const green=[19,138,91],dark=[16,35,27],muted=[101,117,110],light=[241,248,245];
 const ensure=(need=12)=>{if(y+need>280){doc.addPage();y=18}};
 const labelValue=(label,value)=>{
   if(value===undefined||value===null||String(value).trim()==="")return;
   ensure(10);
   doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...muted);doc.text(label.toUpperCase(),margin,y);
   doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(...dark);
   const lines=doc.splitTextToSize(String(value),112);doc.text(lines,81,y);y+=Math.max(8,lines.length*5.2)
 };
 const section=(title)=>{
   ensure(14);y+=2;doc.setFillColor(...light);doc.roundedRect(margin,y-5,contentW,10,2,2,"F");
   doc.setTextColor(...green);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(title.toUpperCase(),margin+4,y+1.5);y+=11
 };
 const fullClient=[a.clientFirstName,a.clientLastName].filter(Boolean).join(" ")||a.client||"Client";
 const company=state.company||{};
 doc.setFillColor(...green);doc.roundedRect(margin,12,contentW,36,3,3,"F");
 doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text((company.name||"Compagnie des Nuisibles").toUpperCase(),margin+6,23);
 doc.setFont("helvetica","normal");doc.setFontSize(8.5);
 const companyLine=[company.siret?"SIRET "+company.siret:"",company.phone||"",company.email||""].filter(Boolean).join(" · ");
 if(companyLine)doc.text(companyLine,margin+6,30,{maxWidth:145});
 const companyLine2=[company.address||"",company.website||""].filter(Boolean).join(" · ");
 if(companyLine2)doc.text(companyLine2,margin+6,36,{maxWidth:145});
 doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("RAPPORT · PASSAGE "+(a.passage||1),pageW-margin-6,39,{align:"right"});
 y=57;

 section("Fiche client");
 labelValue("Nom",a.clientLastName||a.client);
 labelValue("Prénom",a.clientFirstName||"");
 labelValue("Téléphone",a.clientPhone||"");
 labelValue("E-mail",a.clientEmail||"");
 labelValue("Adresse",a.address||"");
 labelValue("Informations / consignes",a.notes||"");

 section("Intervention");
 labelValue("Prestation",a.type||"");
 labelValue("Date / horaire",(a.date||"")+" · "+(a.start||"")+" - "+(a.end||""));
 labelValue("Technicien",a.technician||"");
 labelValue("Montant TTC",a.amount?Number(a.amount).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €":"Non renseigné");
 labelValue("Paiement",a.payment||"Non renseigné");
 if(secondVisit?.date)labelValue("2e passage",secondVisit.date+" à "+(secondVisit.time||""));

 section("Rapport technicien");
 ensure(20);doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(...dark);
 const reportLines=doc.splitTextToSize(a.report||"Aucune observation renseignée.",contentW);
 reportLines.forEach(line=>{ensure(6);doc.text(line,margin,y);y+=5.5});y+=3;

 const addPhotoSet=(title,photos)=>{
   if(!photos?.length)return;
   section(title);
   const gap=5,w=(contentW-gap)/2,h=58;
   for(let i=0;i<photos.length;i++){
     if(i%2===0)ensure(h+8);
     const x=margin+(i%2)*(w+gap);
     try{doc.addImage(photos[i],"JPEG",x,y,w,h,undefined,"FAST")}catch(err){try{doc.addImage(photos[i],"PNG",x,y,w,h,undefined,"FAST")}catch(_){}}
     if(i%2===1||i===photos.length-1)y+=h+6
   }
 };
 addPhotoSet("Photos avant intervention",a.photosBefore||[]);
 addPhotoSet("Photos après intervention",a.photosAfter||[]);
 if(a.signature){
   section("Signature client");ensure(38);
   doc.setDrawColor(210,225,218);doc.roundedRect(margin,y,90,32,2,2,"S");
   try{doc.addImage(a.signature,"PNG",margin+3,y+3,84,26,undefined,"FAST")}catch(_){}
   y+=39
 }
 ensure(18);doc.setDrawColor(225,233,229);doc.line(margin,y,pageW-margin,y);y+=6;
 doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...muted);
 doc.text("Document généré depuis l'espace d'intervention Compagnie des Nuisibles.",margin,y);
 doc.text("Rapport généré le "+new Date().toLocaleDateString("fr-FR"),pageW-margin,y,{align:"right"});
 const total=doc.getNumberOfPages();
 for(let i=1;i<=total;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(...muted);doc.text("Page "+i+" / "+total,pageW-margin,292,{align:"right"})}
 doc.save("Rapport_"+safeFileName(fullClient)+"_"+(a.date||today())+".pdf")
}
function bindPhotoInput(inputSel,previewSel,setter,current){
 const input=$(inputSel), preview=$(previewSel); if(!input)return;
 input.onchange=async()=>{
   const files=[...input.files].slice(0,3);
   const arr=[];
   for(const file of files) arr.push(await compressImage(file,640,.58));
   setter(arr); preview.innerHTML=arr.map(src=>'<img src="'+src+'" alt="Photo intervention">').join("");
 };
}
function compressImage(file,maxSize=900,quality=.72){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxSize||h>maxSize){const r=Math.min(maxSize/w,maxSize/h);w=Math.round(w*r);h=Math.round(h*r)}const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=reader.result};
   reader.onerror=reject;reader.readAsDataURL(file);
 });
}
function addHour(t){const [h,m]=t.split(":").map(Number);return String((h+1)%24).padStart(2,"0")+":"+String(m).padStart(2,"0")}
function setupSig(existing){const c=$("#sig"),ctx=c.getContext("2d"),r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap="round";if(existing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=existing}let d=false;const p=e=>{const q=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-q.left,t.clientY-q.top]};const st=e=>{d=true;const[x,y]=p(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};const mv=e=>{if(!d)return;const[x,y]=p(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()};const sp=()=>d=false;c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",sp);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",sp);$("#clearSig").onclick=()=>ctx.clearRect(0,0,r.width,r.height)}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
