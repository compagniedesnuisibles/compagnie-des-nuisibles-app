<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#138a5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CDN Planning">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Compagnie des Nuisibles</title>
  <style>
:root{
  --bg:#f6f8f7;--card:#fff;--ink:#10231b;--muted:#708078;--line:#e3ebe7;
  --green:#138a5b;--green-dark:#0c6843;--green-soft:#eaf7f1;--green-pale:#f4fbf7;
  --amber:#a86411;--red:#b42318;--shadow:0 10px 30px rgba(16,35,27,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brandline{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--green),var(--green-dark));display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:-.04em}
.brand{font-weight:850;font-size:1.03rem}
.muted{color:var(--muted);font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid var(--line);padding:6px;border-radius:15px;width:max-content;max-width:100%}
.nav button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;min-height:44px}
.nav button{background:transparent;color:var(--muted)}
.nav .active{background:var(--green-soft);color:var(--green-dark)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-soft{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:#fff1f0;border:1px solid #ffd5d2;color:var(--red)}
.grid{display:grid;gap:14px}.grid2{grid-template-columns:1fr 1fr}
.field{margin-bottom:14px}
label{display:block;font-weight:750;font-size:.84rem;margin-bottom:7px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:46px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#8bd0b3;box-shadow:0 0 0 3px var(--green-soft)}
textarea{min-height:112px;resize:vertical}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-bottom:14px}
.hero-main{background:linear-gradient(135deg,#0d6d47,#159566);color:#fff;border-radius:22px;padding:20px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.hero-main h2{margin:0;font-size:1.55rem}
.hero-main .muted{color:#d8f4e7}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}
.metric strong{display:block;font-size:1.65rem;line-height:1.1;margin-top:5px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.section-title h2{margin:0;font-size:1.12rem}
.appt{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;padding:15px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff}
.appt:hover{border-color:#cfe4da}
.time{font-weight:850;font-size:1rem;color:var(--green-dark)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1f5f3;color:#496258;font-size:.74rem;margin:7px 5px 0 0;font-weight:700}
.badge.green,.done{background:var(--green-soft);color:var(--green-dark)}
.todo{background:#fff6e9;color:var(--amber)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top right,#e8f7ef 0,transparent 35%),var(--bg)}
.login .card{width:min(460px,100%);padding:24px}
.login-head{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.notice{background:var(--green-pale);border:1px solid #d5eee2;color:var(--green-dark);padding:11px 12px;border-radius:12px;font-size:.84rem;margin-bottom:14px}
.report-head{background:linear-gradient(135deg,#f0faf5,#fff);border:1px solid #dbeee5;border-radius:18px;padding:16px;margin-bottom:16px}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.photo-box{border:1px dashed #b7d6c8;border-radius:16px;padding:14px;background:#fbfefc}
.photo-box input{border:0;padding:8px 0;min-height:auto}
.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.previews img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.followup{background:var(--green-pale);border:1px solid #cdebdc;border-radius:16px;padding:15px;margin:16px 0}
canvas{width:100%;height:190px;border:1px dashed #9cc8b4;border-radius:14px;background:#fff;touch-action:none}
.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pay-chip{background:#eef8f3;color:var(--green-dark)}
.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.view-switch{display:flex;gap:6px;flex-wrap:wrap;background:#f5f8f6;border:1px solid var(--line);padding:5px;border-radius:12px}
.view-switch button{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px;font-weight:750}
.view-switch button.active{background:#fff;color:var(--green-dark);box-shadow:0 2px 8px rgba(16,35,27,.06)}
.calendar-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.cal-head{font-size:.72rem;font-weight:800;color:var(--muted);padding:4px 5px;text-align:center}
.cal-day{min-height:92px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.cal-day:hover{border-color:#9fd1ba}.cal-day.today{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft) inset}.cal-day.out{opacity:.38}
.cal-num{font-weight:800;font-size:.84rem}.cal-events{display:flex;flex-direction:column;gap:4px}
.cal-event{font-size:.68rem;padding:4px 5px;border-radius:7px;background:var(--green-soft);color:var(--green-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-free{font-size:.67rem;color:#2f7a57;margin-top:auto}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow:auto;padding-bottom:4px}
.week-day{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;min-height:190px}
.week-day.today{border-color:var(--green)}.week-title{font-size:.78rem;font-weight:800;margin-bottom:8px}
.year-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mini-month{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.mini-month h3{font-size:.88rem;margin:0 0 8px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.mini-cell{font-size:.62rem;text-align:center;padding:4px 2px;border-radius:6px;cursor:pointer}.mini-cell.busy{background:var(--green-soft);color:var(--green-dark);font-weight:800}.mini-cell.out{opacity:.15}
.agenda-day-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.availability{font-size:.75rem;font-weight:750;color:var(--green-dark);background:var(--green-soft);padding:5px 8px;border-radius:999px}
@media(max-width:800px){
  .wrap{padding:12px}.grid2,.report-grid,.hero{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.year-grid{grid-template-columns:1fr 1fr}.cal-day{min-height:76px;padding:6px}.cal-event{font-size:.62rem}
  .appt{grid-template-columns:62px minmax(0,1fr)}.appt .actions{grid-column:1/-1}
  .nav{width:100%;overflow:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}
  .top{align-items:flex-start}.previews{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:430px){.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:1.35rem}.wrap{padding:9px}.card{padding:14px;border-radius:16px}.year-grid{grid-template-columns:1fr}.cal-grid{gap:3px}.cal-day{min-height:64px;padding:4px}.cal-event{display:none}.cal-head{font-size:.62rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const DEFAULT_USERS=[
 {id:"u-admin-demo",email:"admin@demo.local",code:"2468",role:"admin",name:"Administrateur",active:true},
 {id:"u-tech-demo",email:"technicien@demo.local",code:"1234",role:"tech",name:"Technicien Démo",active:true}
];
const today=()=>new Date().toISOString().slice(0,10);
const esc=(v="")=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let state={
 user:null,
 tab:"planning",
 date:today(),
 calendarView:"day",
 techFilter:"all",
 users:JSON.parse(localStorage.getItem("cdn_users")||"null")||DEFAULT_USERS,
 appts:JSON.parse(localStorage.getItem("cdn_appts")||"null")||[
  {id:crypto.randomUUID(),date:today(),start:"09:00",end:"10:00",client:"Client Démo",address:"Levallois-Perret",type:"Dératisation",technician:"Technicien Démo",techEmail:"technicien@demo.local",notes:"Exemple uniquement.",status:"todo",report:"",signature:"",passage:1,parentId:""}
 ]
};
const save=()=>{localStorage.setItem("cdn_appts",JSON.stringify(state.appts));localStorage.setItem("cdn_users",JSON.stringify(state.users))};
(function ensureTestIntervention(){
 const testId="test-mail-intervention-2026-09-20";
 if(!state.appts.some(a=>a.id===testId)){
   state.appts.push({
     id:testId,
     date:"2026-09-20",
     start:"10:00",
     end:"11:00",
     client:"INTERVENTION TEST MAIL",
     address:"Levallois-Perret",
     type:"Dératisation",
     technician:"Technicien Démo",
     techEmail:"technicien@demo.local",
     notes:"Intervention de test pour vérifier le planning et la réception e-mail.",
     status:"todo",
     report:"",
     signature:"",
     payment:"",
     photosBefore:[],
     photosAfter:[],
     passage:1,
     parentId:""
   });
   save();
 }
})();
function shell(sub,body){return '<div class="wrap"><div class="top"><div class="brandline"><div class="logo">CN</div><div><div class="brand">Compagnie des Nuisibles</div><div class="muted">'+esc(sub)+'</div></div></div><button id="logout" class="btn btn-soft">Déconnexion</button></div>'+body+'</div>'}
function render(){if(!state.user)return login();state.user.role==="admin"?admin():tech()}
function login(){
 $("#app").innerHTML='<div class="login"><div class="card"><div class="login-head"><div class="logo">CN</div><div><div class="brand" style="font-size:1.15rem">Compagnie des Nuisibles</div><div class="muted">Espace interventions</div></div></div><div class="notice">Version de démonstration sécurisée sans données clients réelles.</div><form id="login"><div class="field"><label>E-mail professionnel</label><input name="email" type="email" required placeholder="votre@email.fr"></div><div class="field"><label>Code d’accès</label><input name="code" inputmode="numeric" required placeholder="••••"></div><button class="btn btn-primary" style="width:100%">Se connecter</button></form><div class="muted" style="margin-top:14px">Admin démo : admin@demo.local / 2468 · Technicien : technicien@demo.local / 1234</div></div></div>';
 $("#login").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const u=state.users.find(x=>x.active!==false&&x.email===d.email.trim().toLowerCase()&&x.code===d.code.trim());if(!u)return alert("E-mail, code incorrect ou compte désactivé");state.user=u;render()}
}
function nav(){return '<div class="nav"><button data-tab="planning" class="'+(state.tab==="planning"?"active":"")+'">Planning</button><button data-tab="new" class="'+(state.tab==="new"?"active":"")+'">Nouvelle intervention</button><button data-tab="history" class="'+(state.tab==="history"?"active":"")+'">Historique</button><button data-tab="users" class="'+(state.tab==="users"?"active":"")+'">Utilisateurs</button></div>'}
function admin(){
 const list=state.appts.filter(a=>a.date===state.date).sort((a,b)=>a.start.localeCompare(b.start));
 let body=nav();
 if(state.tab==="planning") body+=planning(list);
 else if(state.tab==="new") body+=form();
 else if(state.tab==="history") body+=history();
 else body+=usersView();
 $("#app").innerHTML=shell("Espace administrateur",body);bindAdmin()
}
function planning(list){
 const all=calendarSource(true);
 const visible=filterCalendarTech(all);
 const dayList=visible.filter(a=>a.date===state.date).sort((a,b)=>a.start.localeCompare(b.start));
 const done=dayList.filter(a=>a.status==="done").length, follow=dayList.filter(a=>(a.passage||1)===2).length;
 const techs=state.users.filter(u=>u.role==="tech"&&u.active!==false);
 return '<div class="hero"><div class="hero-main"><div><div class="muted">Agenda équipe</div><h2>Planning & disponibilités</h2></div><div class="muted">'+visible.length+' intervention(s) dans la période affichée</div></div><div class="metrics"><div class="metric"><span class="muted">Aujourd’hui</span><strong>'+dayList.length+'</strong></div><div class="metric"><span class="muted">Terminées</span><strong>'+done+'</strong></div></div></div>'+
 '<div class="card">'+calendarControls(techs,true)+calendarBody(visible,true)+'</div>'
}
function calendarSource(adminMode){
 return adminMode?state.appts:state.appts.filter(a=>a.techEmail===state.user.email)
}
function filterCalendarTech(list){
 if(state.user?.role!=="admin"||state.techFilter==="all")return list;
 return list.filter(a=>a.techEmail===state.techFilter)
}
function calendarControls(techs,showFilter){
 const filter=showFilter?'<select id="techFilter" style="width:auto;min-width:190px"><option value="all">Tous les techniciens</option>'+techs.map(u=>'<option value="'+esc(u.email)+'" '+(state.techFilter===u.email?"selected":"")+'>'+esc(u.name)+'</option>').join("")+'</select>':'';
 return '<div class="calendar-toolbar"><div><div class="view-switch">'+["day","week","month","year"].map(v=>'<button type="button" data-cal-view="'+v+'" class="'+(state.calendarView===v?"active":"")+'">'+({day:"Jour",week:"Semaine",month:"Mois",year:"Année"}[v])+'</button>').join("")+'</div></div><div class="calendar-nav"><button class="btn btn-soft" type="button" id="calPrev">‹</button><button class="btn btn-soft" type="button" id="calToday">Aujourd’hui</button><button class="btn btn-soft" type="button" id="calNext">›</button><input id="calDate" type="date" value="'+state.date+'" style="width:auto">'+filter+'</div></div>'
}
function calendarBody(list,adminMode){
 if(state.calendarView==="day")return dayCalendar(list,adminMode);
 if(state.calendarView==="week")return weekCalendar(list,adminMode);
 if(state.calendarView==="month")return monthCalendar(list,adminMode);
 return yearCalendar(list)
}
function dateObj(s){const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))}
function dateStr(d){return d.toISOString().slice(0,10)}
function addDays(s,n){const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return dateStr(d)}
function startOfWeek(s){const d=dateObj(s),day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day);return dateStr(d)}
function monthInfo(s){const d=dateObj(s);return {y:d.getUTCFullYear(),m:d.getUTCMonth()}}
function fmtDay(s){return new Intl.DateTimeFormat("fr-FR",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}).format(dateObj(s))}
function fmtMonth(y,m){return new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,m,1)))}
function dayCalendar(list,adminMode){
 const day=list.filter(a=>a.date===state.date).sort((a,b)=>a.start.localeCompare(b.start));
 return '<div class="agenda-day-head"><div><h2 style="margin:0">'+fmtDay(state.date)+'</h2><div class="muted">'+day.length+' intervention(s)</div></div><span class="availability">'+(day.length===0?"Journée disponible":day.length<4?"Encore disponible":"Journée chargée")+'</span></div>'+(day.length?day.map(a=>card(a,adminMode)).join(""):'<div class="notice">Aucune intervention planifiée : créneau disponible.</div>')
}
function weekCalendar(list,adminMode){
 const start=startOfWeek(state.date);
 let html='<div class="week-grid">';
 for(let i=0;i<7;i++){const d=addDays(start,i),items=list.filter(a=>a.date===d).sort((a,b)=>a.start.localeCompare(b.start));html+='<div class="week-day '+(d===today()?"today":"")+'" data-cal-date="'+d+'"><div class="week-title">'+fmtDay(d)+'</div>'+(items.length?items.map(a=>'<div class="cal-event" title="'+esc(a.client)+'">'+esc(a.start)+' · '+esc(a.client)+(adminMode?' · '+esc(a.technician):'')+'</div>').join(""):'<div class="cal-free">Disponible</div>')+'</div>'}
 return html+'</div>'
}
function monthCalendar(list,adminMode){
 const {y,m}=monthInfo(state.date), first=new Date(Date.UTC(y,m,1)), offset=(first.getUTCDay()+6)%7, start=new Date(Date.UTC(y,m,1-offset));
 const heads=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(x=>'<div class="cal-head">'+x+'</div>').join("");
 let cells="";
 for(let i=0;i<42;i++){const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const ds=dateStr(d),inMonth=d.getUTCMonth()===m,items=list.filter(a=>a.date===ds).sort((a,b)=>a.start.localeCompare(b.start));cells+='<div class="cal-day '+(!inMonth?"out ":"")+(ds===today()?"today":"")+'" data-cal-date="'+ds+'"><div class="cal-num">'+d.getUTCDate()+'</div><div class="cal-events">'+items.slice(0,3).map(a=>'<div class="cal-event">'+esc(a.start)+' '+esc(a.client)+(adminMode?' · '+esc(a.technician):'')+'</div>').join("")+'</div>'+(items.length===0&&inMonth?'<div class="cal-free">Disponible</div>':'')+(items.length>3?'<div class="muted">+'+(items.length-3)+'</div>':'')+'</div>'}
 return '<div class="section-title"><div><h2>'+fmtMonth(y,m)+'</h2><div class="muted">Clique sur un jour pour ouvrir son planning</div></div></div><div class="cal-grid">'+heads+cells+'</div>'
}
function yearCalendar(list){
 const {y}=monthInfo(state.date);let html='<div class="section-title"><div><h2>'+y+'</h2><div class="muted">Vue annuelle des journées occupées</div></div></div><div class="year-grid">';
 for(let m=0;m<12;m++){const first=new Date(Date.UTC(y,m,1)),offset=(first.getUTCDay()+6)%7,start=new Date(Date.UTC(y,m,1-offset));let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const ds=dateStr(d),inMonth=d.getUTCMonth()===m,busy=list.some(a=>a.date===ds);cells+='<div class="mini-cell '+(!inMonth?"out ":"")+(busy&&inMonth?"busy":"")+'" data-cal-date="'+ds+'">'+d.getUTCDate()+'</div>'}html+='<div class="mini-month"><h3>'+fmtMonth(y,m).replace(" "+y,"")+'</h3><div class="mini-grid">'+cells+'</div></div>'}
 return html+'</div></div>'
}
function card(a,adminMode){const passage=a.passage||1;return '<div class="appt"><div class="time">'+esc(a.start)+'<div class="muted">'+esc(a.end)+'</div></div><div><strong>'+esc(a.client)+'</strong><div class="muted" style="margin-top:3px">'+esc(a.address)+'</div><div class="statusline"><span class="badge green">'+esc(a.type)+'</span><span class="badge">Passage '+passage+'</span><span class="badge">'+esc(a.technician)+'</span><span class="badge '+(a.status==="done"?"done":"todo")+'">'+(a.status==="done"?"Terminé":"À faire")+'</span>'+(a.payment?'<span class="badge pay-chip">'+esc(a.payment)+'</span>':'')+'</div></div><div class="actions">'+(adminMode?'<button class="btn btn-soft" data-edit="'+a.id+'">Modifier</button><button class="btn btn-danger" data-del="'+a.id+'">Supprimer</button>':'<button class="btn btn-primary" data-report="'+a.id+'">'+(a.status==="done"?"Voir le rapport":"Faire le rapport")+'</button>')+'</div></div>'}
function form(id=""){
 const a=id?state.appts.find(x=>x.id===id):null;
 const techs=state.users.filter(u=>u.role==="tech"&&u.active!==false);
 const selectedEmail=a?.techEmail||techs[0]?.email||"";
 return '<div class="card"><h2>'+(a?"Modifier":"Nouvelle")+' intervention</h2><form id="apptForm" data-id="'+(a?.id||"")+'"><div class="grid grid2"><div><div class="field"><label>Date</label><input name="date" type="date" required value="'+(a?.date||state.date)+'"></div><div class="grid grid2"><div class="field"><label>Début</label><input name="start" type="time" required value="'+(a?.start||"09:00")+'"></div><div class="field"><label>Fin</label><input name="end" type="time" required value="'+(a?.end||"10:00")+'"></div></div><div class="field"><label>Client</label><input name="client" required value="'+esc(a?.client||"")+'"></div><div class="field"><label>Adresse</label><input name="address" required value="'+esc(a?.address||"")+'"></div></div><div><div class="field"><label>Type</label><select name="type">'+["Dératisation","Punaises de lit","Cafards","Désinfection","Guêpes/Frelons","Autre"].map(v=>'<option '+(a?.type===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>Technicien</label><select name="techEmail" id="techSelect" required><option value="">Choisir un technicien</option>'+techs.map(u=>'<option value="'+esc(u.email)+'" '+(selectedEmail===u.email?"selected":"")+'>'+esc(u.name)+' — '+esc(u.email)+'</option>').join("")+'</select></div><input type="hidden" name="technician" id="techName" value="'+esc(a?.technician||"")+'"><div class="field"><label>Consignes</label><textarea name="notes">'+esc(a?.notes||"")+'</textarea></div></div></div><div class="actions"><button class="btn btn-primary">Enregistrer</button><button id="cancel" type="button" class="btn btn-soft">Annuler</button></div></form></div>'
}
function history(){return '<div class="card"><h2>Historique</h2>'+[...state.appts].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)).map(a=>card(a,false)).join("")+'</div>'}
function usersView(){
 const admins=state.users.filter(u=>u.role==="admin"), techs=state.users.filter(u=>u.role==="tech");
 const userCard=u=>'<div class="appt" style="grid-template-columns:52px minmax(0,1fr) auto"><div class="logo" style="width:44px;height:44px;border-radius:12px">'+esc((u.name||"?").slice(0,2).toUpperCase())+'</div><div><strong>'+esc(u.name)+'</strong><div class="muted">'+esc(u.email)+'</div><div class="statusline"><span class="badge '+(u.role==="admin"?"green":"")+'">'+(u.role==="admin"?"Administrateur":"Technicien")+'</span><span class="badge '+(u.active!==false?"done":"")+'">'+(u.active!==false?"Actif":"Désactivé")+'</span></div></div><div class="actions"><button class="btn btn-soft" data-user-edit="'+u.id+'">Modifier</button><button class="btn '+(u.active!==false?"btn-danger":"btn-soft")+'" data-user-toggle="'+u.id+'">'+(u.active!==false?"Désactiver":"Réactiver")+'</button></div></div>';
 return '<div class="grid grid2"><div class="card"><div class="section-title"><div><h2>Utilisateurs</h2><div class="muted">Crée les comptes administrateurs et techniciens.</div></div></div><form id="userForm"><input type="hidden" name="id" id="userId"><div class="field"><label>Nom</label><input name="name" id="userName" required placeholder="Nom du collaborateur"></div><div class="field"><label>Rôle</label><select name="role" id="userRole"><option value="tech">Technicien</option><option value="admin">Administrateur</option></select></div><div class="field"><label>E-mail de connexion</label><input name="email" id="userEmail" type="email" required placeholder="prenom@entreprise.fr"></div><div class="field"><label>Code de connexion</label><input name="code" id="userCode" inputmode="numeric" minlength="4" required placeholder="4 chiffres minimum"></div><div class="actions"><button class="btn btn-primary" id="saveUser">Créer l’utilisateur</button><button type="button" class="btn btn-soft" id="cancelUser" style="display:none">Annuler</button></div></form></div><div><div class="card"><h2 style="margin-top:0">Techniciens</h2>'+(techs.length?techs.map(userCard).join(""):'<div class="muted">Aucun technicien.</div>')+'</div><div class="card"><h2 style="margin-top:0">Administrateurs</h2>'+(admins.length?admins.map(userCard).join(""):'<div class="muted">Aucun administrateur.</div>')+'</div></div></div>'
}
function bindAdmin(){
 $("#logout").onclick=()=>{state.user=null;render()};
 $$("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 bindCalendar();
 $$("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Supprimer cette intervention ?")){state.appts=state.appts.filter(a=>a.id!==b.dataset.del);save();render()}});
 $$("[data-edit]").forEach(b=>b.onclick=()=>{$("#app").innerHTML=shell("Espace administrateur",form(b.dataset.edit));$("#logout").onclick=()=>{state.user=null;render()};bindForm()});
 bindForm();
 bindUsers()
}
function bindCalendar(){
 if($("#calDate"))$("#calDate").onchange=e=>{state.date=e.target.value;render()};
 if($("#techFilter"))$("#techFilter").onchange=e=>{state.techFilter=e.target.value;render()};
 $("[data-cal-view]").forEach(b=>b.onclick=()=>{state.calendarView=b.dataset.calView;render()});
 $("[data-cal-date]").forEach(el=>el.onclick=e=>{if(e.target.closest("[data-report],[data-edit],[data-del]"))return;state.date=el.dataset.calDate;state.calendarView="day";render()});
 if($("#calToday"))$("#calToday").onclick=()=>{state.date=today();render()};
 if($("#calPrev"))$("#calPrev").onclick=()=>{state.date=shiftPeriod(state.date,-1,state.calendarView);render()};
 if($("#calNext"))$("#calNext").onclick=()=>{state.date=shiftPeriod(state.date,1,state.calendarView);render()};
}
function shiftPeriod(s,dir,view){
 const d=dateObj(s);
 if(view==="day")d.setUTCDate(d.getUTCDate()+dir);
 else if(view==="week")d.setUTCDate(d.getUTCDate()+7*dir);
 else if(view==="month")d.setUTCMonth(d.getUTCMonth()+dir);
 else d.setUTCFullYear(d.getUTCFullYear()+dir);
 return dateStr(d)
}
function bindForm(){
 const f=$("#apptForm");if(!f)return;
 if($("#cancel"))$("#cancel").onclick=()=>{state.tab="planning";render()};
 const syncTech=()=>{const u=state.users.find(x=>x.email===$("#techSelect")?.value);if($("#techName"))$("#techName").value=u?.name||""};
 if($("#techSelect")){$("#techSelect").onchange=syncTech;syncTech()}
 f.onsubmit=e=>{e.preventDefault();syncTech();const d=Object.fromEntries(new FormData(f));if(!d.techEmail)return alert("Choisis un technicien.");const id=f.dataset.id;if(id)state.appts=state.appts.map(a=>a.id===id?{...a,...d}:a);else state.appts.push({id:crypto.randomUUID(),...d,status:"todo",report:"",signature:"",passage:1,parentId:""});save();state.date=d.date;alert("Intervention enregistrée.");state.tab="planning";render()}
}
function bindUsers(){
 const form=$("#userForm"); if(!form)return;
 const reset=()=>{form.reset();$("#userId").value="";$("#saveUser").textContent="Créer l’utilisateur";$("#cancelUser").style.display="none"};
 $("#cancelUser").onclick=reset;
 $("[data-user-edit]").forEach(b=>b.onclick=()=>{const u=state.users.find(x=>x.id===b.dataset.userEdit);if(!u)return;$("#userId").value=u.id;$("#userName").value=u.name;$("#userRole").value=u.role;$("#userEmail").value=u.email;$("#userCode").value=u.code;$("#saveUser").textContent="Enregistrer les modifications";$("#cancelUser").style.display="inline-block";window.scrollTo({top:0,behavior:"smooth"})});
 $("[data-user-toggle]").forEach(b=>b.onclick=()=>{const u=state.users.find(x=>x.id===b.dataset.userToggle);if(!u)return;if(u.id===state.user.id&&u.active!==false)return alert("Tu ne peux pas désactiver ton propre compte pendant que tu es connecté.");u.active=u.active===false?true:false;save();render()});
 form.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));d.email=d.email.trim().toLowerCase();d.code=d.code.trim();if(d.code.length<4)return alert("Le code doit contenir au moins 4 caractères.");const duplicate=state.users.find(u=>u.email===d.email&&u.id!==d.id);if(duplicate)return alert("Un utilisateur utilise déjà cette adresse e-mail.");if(d.id){state.users=state.users.map(u=>u.id===d.id?{...u,name:d.name.trim(),role:d.role,email:d.email,code:d.code}:u)}else{state.users.push({id:crypto.randomUUID(),name:d.name.trim(),role:d.role,email:d.email,code:d.code,active:true})}save();alert(d.id?"Utilisateur modifié.":"Utilisateur créé.");render()}
}
function tech(){
 const list=calendarSource(false);
 $("#app").innerHTML=shell("Espace technicien",'<div class="card">'+calendarControls([],false)+calendarBody(list,false)+'</div>');
 $("#logout").onclick=()=>{state.user=null;render()};
 bindCalendar();
 $("[data-report]").forEach(b=>b.onclick=()=>report(b.dataset.report))
}
function report(id){
 const a=state.appts.find(x=>x.id===id), passage=a.passage||1;
 const before=a.photosBefore||[], after=a.photosAfter||[];
 $("#app").innerHTML=shell("Rapport technicien",
 '<div class="report-head"><div class="muted">INTERVENTION · PASSAGE '+passage+'</div><h2 style="margin:5px 0 6px">'+esc(a.client)+'</h2><div>'+esc(a.type)+' · '+esc(a.date)+' · '+esc(a.start)+'-'+esc(a.end)+'</div><div class="muted" style="margin-top:5px">'+esc(a.address)+'</div></div>'+
 '<div class="card"><form id="reportForm">'+
 '<div class="report-grid"><div><div class="field"><label>Mode de paiement</label><select id="payment"><option value="">Choisir</option>'+["Carte bancaire","Espèces","Virement","Chèque","Non payé"].map(v=>'<option '+(a.payment===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>Rapport d’intervention</label><textarea id="reportText" required placeholder="Travaux réalisés, observations, recommandations...">'+esc(a.report||"")+'</textarea></div></div>'+
 '<div><div class="photo-box"><label>Photos avant intervention</label><input id="photosBefore" type="file" accept="image/*" multiple><div class="muted">Maximum 3 photos.</div><div id="beforePreview" class="previews">'+before.map(src=>'<img src="'+src+'" alt="Photo avant">').join("")+'</div></div><div class="photo-box" style="margin-top:12px"><label>Photos après intervention</label><input id="photosAfter" type="file" accept="image/*" multiple><div class="muted">Maximum 3 photos.</div><div id="afterPreview" class="previews">'+after.map(src=>'<img src="'+src+'" alt="Photo après">').join("")+'</div></div></div></div>'+
 (passage===1?'<div class="followup"><label style="display:flex;align-items:center;gap:10px;font-size:.95rem"><input id="needSecond" type="checkbox" style="width:22px;height:22px;min-height:auto;accent-color:var(--green)"> Programmer un 2e passage</label><div id="secondFields" style="display:none;margin-top:14px"><div class="grid grid2"><div class="field"><label>Date du 2e passage</label><input id="secondDate" type="date" min="'+today()+'"></div><div class="field"><label>Heure du 2e passage</label><input id="secondTime" type="time" value="'+esc(a.start)+'"></div></div><div class="muted">Une fois le rapport validé, ce 2e passage sera ajouté automatiquement au planning du technicien.</div></div></div>':'')+
 '<div class="field"><label>Signature du client</label><canvas id="sig"></canvas><button id="clearSig" type="button" class="btn btn-soft" style="margin-top:8px">Effacer la signature</button></div>'+
 '<div class="notice" style="margin-top:14px">À la validation, le rapport est enregistré puis envoyé automatiquement par e-mail à l’administrateur.</div>'+
 '<div class="actions"><button class="btn btn-primary">Valider le rapport</button><button id="back" type="button" class="btn btn-soft">Retour</button></div></form></div>');
 $("#logout").onclick=()=>{state.user=null;render()};$("#back").onclick=render;setupSig(a.signature);
 let nextBefore=[...before], nextAfter=[...after];
 bindPhotoInput("#photosBefore","#beforePreview",arr=>nextBefore=arr,nextBefore);
 bindPhotoInput("#photosAfter","#afterPreview",arr=>nextAfter=arr,nextAfter);
 if($("#needSecond"))$("#needSecond").onchange=e=>{const yes=e.target.checked;$("#secondFields").style.display=yes?"block":"none";$("#secondDate").required=yes;$("#secondTime").required=yes};
 $("#reportForm").onsubmit=async e=>{
   e.preventDefault();
   const submitBtn=e.currentTarget.querySelector('button[type="submit"]');
   if(submitBtn){submitBtn.disabled=true;submitBtn.textContent="Envoi du rapport..."}
   a.report=$("#reportText").value.trim();a.payment=$("#payment").value;a.signature=$("#sig").toDataURL("image/png");a.status="done";a.photosBefore=nextBefore;a.photosAfter=nextAfter;
   let secondVisit=null;
   if(passage===1 && $("#needSecond")?.checked){
     const d=$("#secondDate").value,t=$("#secondTime").value;
     if(!d||!t){if(submitBtn){submitBtn.disabled=false;submitBtn.textContent="Valider le rapport"}return alert("Choisis la date et l’heure du deuxième passage.")}
     secondVisit={date:d,time:t};
     const exists=state.appts.some(x=>x.parentId===a.id&&x.passage===2);
     if(!exists){
       state.appts.push({id:crypto.randomUUID(),date:d,start:t,end:addHour(t),client:a.client,address:a.address,type:a.type,technician:a.technician,techEmail:a.techEmail,notes:"Deuxième passage programmé par le technicien depuis le rapport du passage 1.",status:"todo",report:"",signature:"",payment:"",photosBefore:[],photosAfter:[],passage:2,parentId:a.id});
     }
   }
   try{save()}catch(err){if(submitBtn){submitBtn.disabled=false;submitBtn.textContent="Valider le rapport"}return alert("Les photos sont trop lourdes. Choisis moins de photos.")}
   try{
     const response=await fetch("/api/send-report",{
       method:"POST",
       headers:{"Content-Type":"application/json"},
       body:JSON.stringify({
         client:a.client,address:a.address,type:a.type,technician:a.technician,techEmail:a.techEmail,
         date:a.date,start:a.start,end:a.end,passage:a.passage||1,payment:a.payment,report:a.report,
         secondVisit,photosBefore:a.photosBefore||[],photosAfter:a.photosAfter||[],signature:a.signature
       })
     });
     const result=await response.json().catch(()=>({}));
     if(!response.ok)throw new Error(result.error||"Échec de l’envoi");
     alert("Rapport enregistré et envoyé par e-mail"+(secondVisit?" · deuxième passage ajouté au planning.":"."));
   }catch(err){
     console.error(err);
     alert("Rapport enregistré, mais l’e-mail n’a pas pu être envoyé : "+err.message);
   }
   render()
 }
}
function bindPhotoInput(inputSel,previewSel,setter,current){
 const input=$(inputSel), preview=$(previewSel); if(!input)return;
 input.onchange=async()=>{
   const files=[...input.files].slice(0,3);
   const arr=[];
   for(const file of files) arr.push(await compressImage(file,640,.58));
   setter(arr); preview.innerHTML=arr.map(src=>'<img src="'+src+'" alt="Photo intervention">').join("");
 };
}
function compressImage(file,maxSize=900,quality=.72){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxSize||h>maxSize){const r=Math.min(maxSize/w,maxSize/h);w=Math.round(w*r);h=Math.round(h*r)}const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=reader.result};
   reader.onerror=reject;reader.readAsDataURL(file);
 });
}
function addHour(t){const [h,m]=t.split(":").map(Number);return String((h+1)%24).padStart(2,"0")+":"+String(m).padStart(2,"0")}
function setupSig(existing){const c=$("#sig"),ctx=c.getContext("2d"),r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap="round";if(existing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=existing}let d=false;const p=e=>{const q=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-q.left,t.clientY-q.top]};const st=e=>{d=true;const[x,y]=p(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};const mv=e=>{if(!d)return;const[x,y]=p(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()};const sp=()=>d=false;c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",sp);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",sp);$("#clearSig").onclick=()=>ctx.clearRect(0,0,r.width,r.height)}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
