<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#138a5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CDN Planning">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Compagnie des Nuisibles</title>
  <style>
:root{
  --bg:#f6f8f7;--card:#fff;--ink:#10231b;--muted:#708078;--line:#e3ebe7;
  --green:#138a5b;--green-dark:#0c6843;--green-soft:#eaf7f1;--green-pale:#f4fbf7;
  --amber:#a86411;--red:#b42318;--shadow:0 10px 30px rgba(16,35,27,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brandline{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--green),var(--green-dark));display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:-.04em}
.brand{font-weight:850;font-size:1.03rem}
.muted{color:var(--muted);font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1px solid var(--line);padding:6px;border-radius:15px;width:max-content;max-width:100%}
.nav button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;min-height:44px}
.nav button{background:transparent;color:var(--muted)}
.nav .active{background:var(--green-soft);color:var(--green-dark)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-soft{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:#fff1f0;border:1px solid #ffd5d2;color:var(--red)}
.grid{display:grid;gap:14px}.grid2{grid-template-columns:1fr 1fr}
.field{margin-bottom:14px}
label{display:block;font-weight:750;font-size:.84rem;margin-bottom:7px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:46px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#8bd0b3;box-shadow:0 0 0 3px var(--green-soft)}
textarea{min-height:112px;resize:vertical}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-bottom:14px}
.hero-main{background:linear-gradient(135deg,#0d6d47,#159566);color:#fff;border-radius:22px;padding:20px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.hero-main h2{margin:0;font-size:1.55rem}
.hero-main .muted{color:#d8f4e7}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}
.metric strong{display:block;font-size:1.65rem;line-height:1.1;margin-top:5px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}
.section-title h2{margin:0;font-size:1.12rem}
.appt{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;padding:15px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff}
.appt:hover{border-color:#cfe4da}
.time{font-weight:850;font-size:1rem;color:var(--green-dark)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1f5f3;color:#496258;font-size:.74rem;margin:7px 5px 0 0;font-weight:700}
.badge.green,.done{background:var(--green-soft);color:var(--green-dark)}
.todo{background:#fff6e9;color:var(--amber)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top right,#e8f7ef 0,transparent 35%),var(--bg)}
.login .card{width:min(460px,100%);padding:24px}
.login-head{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.notice{background:var(--green-pale);border:1px solid #d5eee2;color:var(--green-dark);padding:11px 12px;border-radius:12px;font-size:.84rem;margin-bottom:14px}
.report-head{background:linear-gradient(135deg,#f0faf5,#fff);border:1px solid #dbeee5;border-radius:18px;padding:16px;margin-bottom:16px}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.photo-box{border:1px dashed #b7d6c8;border-radius:16px;padding:14px;background:#fbfefc}
.photo-box input{border:0;padding:8px 0;min-height:auto}
.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.previews img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.followup{background:var(--green-pale);border:1px solid #cdebdc;border-radius:16px;padding:15px;margin:16px 0}
canvas{width:100%;height:190px;border:1px dashed #9cc8b4;border-radius:14px;background:#fff;touch-action:none}
.statusline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pay-chip{background:#eef8f3;color:var(--green-dark)}
@media(max-width:800px){
  .wrap{padding:12px}.grid2,.report-grid,.hero{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}
  .appt{grid-template-columns:62px minmax(0,1fr)}.appt .actions{grid-column:1/-1}
  .nav{width:100%;overflow:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}
  .top{align-items:flex-start}.previews{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:430px){.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:1.35rem}.wrap{padding:9px}.card{padding:14px;border-radius:16px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const USERS=[
 {email:"admin@demo.local",code:"2468",role:"admin",name:"Administrateur"},
 {email:"technicien@demo.local",code:"1234",role:"tech",name:"Technicien Démo"}
];
const today=()=>new Date().toISOString().slice(0,10);
const esc=(v="")=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let state={user:null,tab:"planning",date:today(),appts:JSON.parse(localStorage.getItem("cdn_appts")||"null")||[
{id:crypto.randomUUID(),date:today(),start:"09:00",end:"10:00",client:"Client Démo",address:"Levallois-Perret",type:"Dératisation",technician:"Technicien Démo",techEmail:"technicien@demo.local",notes:"Exemple uniquement.",status:"todo",report:"",signature:"",passage:1,parentId:""}
]};
const save=()=>localStorage.setItem("cdn_appts",JSON.stringify(state.appts));
function shell(sub,body){return '<div class="wrap"><div class="top"><div class="brandline"><div class="logo">CN</div><div><div class="brand">Compagnie des Nuisibles</div><div class="muted">'+esc(sub)+'</div></div></div><button id="logout" class="btn btn-soft">Déconnexion</button></div>'+body+'</div>'}
function render(){if(!state.user)return login();state.user.role==="admin"?admin():tech()}
function login(){
 $("#app").innerHTML='<div class="login"><div class="card"><div class="login-head"><div class="logo">CN</div><div><div class="brand" style="font-size:1.15rem">Compagnie des Nuisibles</div><div class="muted">Espace interventions</div></div></div><div class="notice">Version de démonstration sécurisée sans données clients réelles.</div><form id="login"><div class="field"><label>E-mail professionnel</label><input name="email" type="email" required placeholder="votre@email.fr"></div><div class="field"><label>Code d’accès</label><input name="code" inputmode="numeric" required placeholder="••••"></div><button class="btn btn-primary" style="width:100%">Se connecter</button></form><div class="muted" style="margin-top:14px">Admin démo : admin@demo.local / 2468 · Technicien : technicien@demo.local / 1234</div></div></div>';
 $("#login").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const u=USERS.find(x=>x.email===d.email.trim().toLowerCase()&&x.code===d.code.trim());if(!u)return alert("E-mail ou code incorrect");state.user=u;render()}
}
function nav(){return '<div class="nav"><button data-tab="planning" class="'+(state.tab==="planning"?"active":"")+'">Planning</button><button data-tab="new" class="'+(state.tab==="new"?"active":"")+'">Nouvelle intervention</button><button data-tab="history" class="'+(state.tab==="history"?"active":"")+'">Historique</button></div>'}
function admin(){
 const list=state.appts.filter(a=>a.date===state.date).sort((a,b)=>a.start.localeCompare(b.start));
 let body=nav();
 if(state.tab==="planning") body+=planning(list);
 else if(state.tab==="new") body+=form();
 else body+=history();
 $("#app").innerHTML=shell("Espace administrateur",body);bindAdmin()
}
function planning(list){
 const done=list.filter(a=>a.status==="done").length, follow=list.filter(a=>(a.passage||1)===2).length;
 return '<div class="hero"><div class="hero-main"><div><div class="muted">Vue du '+esc(state.date)+'</div><h2>Planning des interventions</h2></div><div class="muted">'+list.length+' rendez-vous planifié(s) aujourd’hui</div></div><div class="metrics"><div class="metric"><span class="muted">Terminées</span><strong>'+done+'</strong></div><div class="metric"><span class="muted">2e passages</span><strong>'+follow+'</strong></div></div></div>'+
 '<div class="card"><div class="section-title"><div><h2>Journée</h2><div class="muted">Toutes les interventions par ordre horaire</div></div><input id="day" type="date" value="'+state.date+'" style="width:auto"></div>'+ (list.length?list.map(a=>card(a,true)).join(""):'<div class="muted">Aucune intervention ce jour.</div>') +'</div>'
}
function card(a,adminMode){const passage=a.passage||1;return '<div class="appt"><div class="time">'+esc(a.start)+'<div class="muted">'+esc(a.end)+'</div></div><div><strong>'+esc(a.client)+'</strong><div class="muted" style="margin-top:3px">'+esc(a.address)+'</div><div class="statusline"><span class="badge green">'+esc(a.type)+'</span><span class="badge">Passage '+passage+'</span><span class="badge">'+esc(a.technician)+'</span><span class="badge '+(a.status==="done"?"done":"todo")+'">'+(a.status==="done"?"Terminé":"À faire")+'</span>'+(a.payment?'<span class="badge pay-chip">'+esc(a.payment)+'</span>':'')+'</div></div><div class="actions">'+(adminMode?'<button class="btn btn-soft" data-edit="'+a.id+'">Modifier</button><button class="btn btn-danger" data-del="'+a.id+'">Supprimer</button>':'<button class="btn btn-primary" data-report="'+a.id+'">'+(a.status==="done"?"Voir le rapport":"Faire le rapport")+'</button>')+'</div></div>'}
function form(id=""){const a=id?state.appts.find(x=>x.id===id):null;return '<div class="card"><h2>'+(a?"Modifier":"Nouvelle")+' intervention</h2><form id="apptForm" data-id="'+(a?.id||"")+'"><div class="grid grid2"><div><div class="field"><label>Date</label><input name="date" type="date" required value="'+(a?.date||state.date)+'"></div><div class="grid grid2"><div class="field"><label>Début</label><input name="start" type="time" required value="'+(a?.start||"09:00")+'"></div><div class="field"><label>Fin</label><input name="end" type="time" required value="'+(a?.end||"10:00")+'"></div></div><div class="field"><label>Client</label><input name="client" required value="'+esc(a?.client||"")+'"></div><div class="field"><label>Adresse</label><input name="address" required value="'+esc(a?.address||"")+'"></div></div><div><div class="field"><label>Type</label><select name="type">'+["Dératisation","Punaises de lit","Cafards","Désinfection","Guêpes/Frelons","Autre"].map(v=>'<option '+(a?.type===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>Technicien</label><input name="technician" required value="'+esc(a?.technician||"Technicien Démo")+'"></div><div class="field"><label>E-mail technicien</label><input name="techEmail" type="email" required value="'+esc(a?.techEmail||"technicien@demo.local")+'"></div><div class="field"><label>Consignes</label><textarea name="notes">'+esc(a?.notes||"")+'</textarea></div></div></div><div class="actions"><button class="btn btn-primary">Enregistrer</button><button id="cancel" type="button" class="btn btn-soft">Annuler</button></div></form></div>'}
function history(){return '<div class="card"><h2>Historique</h2>'+[...state.appts].sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)).map(a=>card(a,false)).join("")+'</div>'}
function bindAdmin(){
 $("#logout").onclick=()=>{state.user=null;render()};
 $$("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 if($("#day"))$("#day").onchange=e=>{state.date=e.target.value;render()};
 $$("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Supprimer cette intervention ?")){state.appts=state.appts.filter(a=>a.id!==b.dataset.del);save();render()}});
 $$("[data-edit]").forEach(b=>b.onclick=()=>{$("#app").innerHTML=shell("Espace administrateur",form(b.dataset.edit));$("#logout").onclick=()=>{state.user=null;render()};bindForm()});
 bindForm()
}
function bindForm(){const f=$("#apptForm");if(!f)return;if($("#cancel"))$("#cancel").onclick=()=>{state.tab="planning";render()};f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const id=f.dataset.id;if(id)state.appts=state.appts.map(a=>a.id===id?{...a,...d}:a);else state.appts.push({id:crypto.randomUUID(),...d,status:"todo",report:"",signature:"",passage:1,parentId:""});save();state.date=d.date;alert("Intervention enregistrée.");state.tab="planning";render()}}
function tech(){const list=state.appts.filter(a=>a.techEmail===state.user.email).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));$("#app").innerHTML=shell("Espace technicien",'<div class="card"><h2>Mes interventions</h2>'+(list.length?list.map(a=>card(a,false)).join(""):'<div class="muted">Aucune intervention assignée.</div>')+'</div>');$("#logout").onclick=()=>{state.user=null;render()};$$("[data-report]").forEach(b=>b.onclick=()=>report(b.dataset.report))}
function report(id){
 const a=state.appts.find(x=>x.id===id), passage=a.passage||1;
 const before=a.photosBefore||[], after=a.photosAfter||[];
 $("#app").innerHTML=shell("Rapport technicien",
 '<div class="report-head"><div class="muted">INTERVENTION · PASSAGE '+passage+'</div><h2 style="margin:5px 0 6px">'+esc(a.client)+'</h2><div>'+esc(a.type)+' · '+esc(a.date)+' · '+esc(a.start)+'-'+esc(a.end)+'</div><div class="muted" style="margin-top:5px">'+esc(a.address)+'</div></div>'+
 '<div class="card"><form id="reportForm">'+
 '<div class="report-grid"><div><div class="field"><label>Mode de paiement</label><select id="payment"><option value="">Choisir</option>'+["Carte bancaire","Espèces","Virement","Chèque","Non payé"].map(v=>'<option '+(a.payment===v?"selected":"")+'>'+v+'</option>').join("")+'</select></div><div class="field"><label>Rapport d’intervention</label><textarea id="reportText" required placeholder="Travaux réalisés, observations, recommandations...">'+esc(a.report||"")+'</textarea></div></div>'+
 '<div><div class="photo-box"><label>Photos avant intervention</label><input id="photosBefore" type="file" accept="image/*" multiple><div class="muted">Maximum 3 photos.</div><div id="beforePreview" class="previews">'+before.map(src=>'<img src="'+src+'" alt="Photo avant">').join("")+'</div></div><div class="photo-box" style="margin-top:12px"><label>Photos après intervention</label><input id="photosAfter" type="file" accept="image/*" multiple><div class="muted">Maximum 3 photos.</div><div id="afterPreview" class="previews">'+after.map(src=>'<img src="'+src+'" alt="Photo après">').join("")+'</div></div></div></div>'+
 (passage===1?'<div class="followup"><div class="field"><label>Deuxième passage</label><select id="needSecond"><option value="no">Aucun 2e passage</option><option value="yes">Programmer un 2e passage</option></select></div><div id="secondFields" style="display:none"><div class="grid grid2"><div class="field"><label>Date du 2e passage</label><input id="secondDate" type="date" min="'+today()+'"></div><div class="field"><label>Heure du 2e passage</label><input id="secondTime" type="time" value="'+esc(a.start)+'"></div></div><div class="muted">Le rendez-vous sera automatiquement ajouté au planning de ce technicien.</div></div></div>':'')+
 '<div class="field"><label>Signature du client</label><canvas id="sig"></canvas><button id="clearSig" type="button" class="btn btn-soft" style="margin-top:8px">Effacer la signature</button></div>'+
 '<div class="notice" style="margin-top:14px">À la validation, le rapport est enregistré. L’envoi automatique par e-mail sera activé dès que le backend sécurisé est connecté.</div>'+
 '<div class="actions"><button class="btn btn-primary">Valider le rapport</button><button id="back" type="button" class="btn btn-soft">Retour</button></div></form></div>');
 $("#logout").onclick=()=>{state.user=null;render()};$("#back").onclick=render;setupSig(a.signature);
 let nextBefore=[...before], nextAfter=[...after];
 bindPhotoInput("#photosBefore","#beforePreview",arr=>nextBefore=arr,nextBefore);
 bindPhotoInput("#photosAfter","#afterPreview",arr=>nextAfter=arr,nextAfter);
 if($("#needSecond"))$("#needSecond").onchange=e=>{const yes=e.target.value==="yes";$("#secondFields").style.display=yes?"block":"none";$("#secondDate").required=yes;$("#secondTime").required=yes};
 $("#reportForm").onsubmit=e=>{
   e.preventDefault();
   a.report=$("#reportText").value.trim();a.payment=$("#payment").value;a.signature=$("#sig").toDataURL("image/png");a.status="done";a.photosBefore=nextBefore;a.photosAfter=nextAfter;
   if(passage===1 && $("#needSecond")?.value==="yes"){
     const d=$("#secondDate").value,t=$("#secondTime").value;
     if(!d||!t)return alert("Choisis la date et l’heure du deuxième passage.");
     const exists=state.appts.some(x=>x.parentId===a.id&&x.passage===2);
     if(!exists){
       state.appts.push({id:crypto.randomUUID(),date:d,start:t,end:addHour(t),client:a.client,address:a.address,type:a.type,technician:a.technician,techEmail:a.techEmail,notes:"Deuxième passage programmé par le technicien depuis le rapport du passage 1.",status:"todo",report:"",signature:"",payment:"",photosBefore:[],photosAfter:[],passage:2,parentId:a.id});
     }
   }
   try{save()}catch(err){alert("Les photos sont trop lourdes pour cette version de démonstration. Choisis moins de photos.");return}
   alert("Rapport enregistré"+(passage===1&&$("#needSecond")?.value==="yes"?" et deuxième passage ajouté au planning.":"."));
   render()
 }
}
function bindPhotoInput(inputSel,previewSel,setter,current){
 const input=$(inputSel), preview=$(previewSel); if(!input)return;
 input.onchange=async()=>{
   const files=[...input.files].slice(0,3);
   const arr=[];
   for(const file of files) arr.push(await compressImage(file,900,.72));
   setter(arr); preview.innerHTML=arr.map(src=>'<img src="'+src+'" alt="Photo intervention">').join("");
 };
}
function compressImage(file,maxSize=900,quality=.72){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxSize||h>maxSize){const r=Math.min(maxSize/w,maxSize/h);w=Math.round(w*r);h=Math.round(h*r)}const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=reader.result};
   reader.onerror=reject;reader.readAsDataURL(file);
 });
}
function addHour(t){const [h,m]=t.split(":").map(Number);return String((h+1)%24).padStart(2,"0")+":"+String(m).padStart(2,"0")}
function setupSig(existing){const c=$("#sig"),ctx=c.getContext("2d"),r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap="round";if(existing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=existing}let d=false;const p=e=>{const q=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-q.left,t.clientY-q.top]};const st=e=>{d=true;const[x,y]=p(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};const mv=e=>{if(!d)return;const[x,y]=p(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault()};const sp=()=>d=false;c.addEventListener("mousedown",st);c.addEventListener("mousemove",mv);window.addEventListener("mouseup",sp);c.addEventListener("touchstart",st,{passive:false});c.addEventListener("touchmove",mv,{passive:false});c.addEventListener("touchend",sp);$("#clearSig").onclick=()=>ctx.clearRect(0,0,r.width,r.height)}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
</body>
</html>
