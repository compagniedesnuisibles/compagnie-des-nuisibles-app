<style>

}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea,select{font:inherit}button{cursor:pointer}

.btn-primary{background:linear-gradient(135deg,#118b61,#07583c);color:#fff;box-shadow:0 8px 18px rgba(12,124,84,.18)}
.btn-soft{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-danger{background:var(--red);color:var(--redText);border:1px solid #ffd6d2}

.login-brand{display:flex;gap:14px;align-items:center;margin-bottom:22px}.brandmark{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#149a6a,#07583c);display:grid;place-items:center;color:#fff;font-size:1.25rem;font-weight:900}

.address-option{padding:11px 12px;border-bottom:1px solid #edf2ef;cursor:pointer}.address-option:last-child{border-bottom:0}.address-option:hover{background:#f5faf7}.address-option strong{display:block;font-size:.86rem}.address-option span{font-size:.74rem;color:var(--muted)}
.route-sheet{display:grid;gap:9px}.route-sheet a{width:100%;text-decoration:none}

.tech-date{font-size:1.2rem;font-weight:900;margin-top:18px}.tech-summary{margin-top:12px;padding:14px;display:flex;align-items:center;justify-content:space-between}.progress{width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--green) 0 75%,#e8efeb 75%);display:grid;place-items:center}.progress span{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:.78rem}

.tech-content{padding:6px 14px 90px}.job{padding:14px;margin-bottom:10px}.job-top{display:flex;justify-content:space-between;gap:10px}.job-time{font-weight:900;font-size:1.05rem}.job-main{margin-top:7px;display:flex;gap:12px;align-items:flex-start}.job-main .iconbubble{flex:none}.job-main h3{margin:0 0 4px;font-size:1rem}.job-main p{margin:0;color:var(--muted);font-size:.82rem;line-height:1.35}.job-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.job-actions .btn{padding:10px 8px;font-size:.82rem}
.detail-card{padding:16px;margin-bottom:12px}.detail-card h2{margin:0 0 10px;font-size:1.1rem}.detail-info{display:grid;gap:9px}.detail-line{display:flex;gap:9px;align-items:flex-start}.detail-line b{min-width:88px;font-size:.8rem}.detail-line span{font-size:.82rem;color:var(--muted)}

<body>
<div id="app"></div>
<script>
const SUPABASE_URL="https://fmfarfysmhddviezjwvp.supabase.co";
const SUPABASE_KEY="sb_publishable_uv7CV5zG_SLw8VTQKJCpsA_4A_dkgZU";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=(v="")=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let state={user:null,tab:"dashboard",techScreen:"planning",techPeriod:"today",clients:[],interventions:[],profiles:[],audit:[],planningView:"day",planningDate:isoDate(new Date())};

async function loadAll(){
 const {data:{user}}=await sb.auth.getUser(); if(!user){state.user=null;return}
 const {data:me,error:meErr}=await sb.from("profiles").select("*").eq("id",user.id).single(); if(meErr||!me||!me.active){await sb.auth.signOut();state.user=null;return}
 state.user=me;
 const req=[
  sb.from("interventions").select("*, technician:profiles!interventions_technician_id_fkey(name,email)").order("intervention_date",{ascending:false}).order("start_time",{ascending:false}).limit(200),
  sb.from("profiles").select("id,name,email,role,active").order("name"),
  sb.from("clients").select("*").order("created_at",{ascending:false}).limit(200)
 ];
 if(me.role==="admin")req.push(sb.from("audit_logs").select("*").order("created_at",{ascending:false}).limit(30));
 const res=await Promise.all(req);
 state.interventions=res[0].data||[];
 state.profiles=res[1].data||[];
 state.clients=res[2].data||[];
 state.audit=me.role==="admin"?(res[3]?.data||[]):[];
}
function login(){
 $("#app").innerHTML='<div class="login"><div class="login-card"><div class="login-brand"><div class="brandmark">CN</div><div><div style="font-family:Georgia,serif;font-size:1.35rem">Compagnie des Nuisibles</div><div class="muted">V6 PRO · CRM métier</div></div></div><form id="loginForm"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Code d’accès</label><input name="password" type="password" required></div><button class="btn btn-primary" style="width:100%">Se connecter</button></form></div></div>';
 $("#loginForm").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const {error}=await sb.auth.signInWithPassword({email:d.email.trim().toLowerCase(),password:d.password});if(error)return alert(error.message);await loadAll();render()}
}
function initials(n=""){return n.split(" ").filter(Boolean).map(x=>x[0]).join("").slice(0,2).toUpperCase()||"CN"}
function sLabel(s){return({todo:"À faire",scheduled:"Planifiée",en_route:"En route",onsite:"Sur place",done:"Terminée",revisit:"À revoir",cancelled:"Annulée"}[s]||s)}
function sClass(s){return s==="done"?"done":s==="en_route"?"route":s==="onsite"?"onsite":s==="revisit"||s==="cancelled"?"warn":""}
function adminNav(){
 const items=[["dashboard","⌂","Tableau de bord"],["clients","👥","Clients"],["interventions","▣","Interventions"],["planning","▦","Planning"],["reports","▤","Rapports"],["technicians","◉","Techniciens"],["security","⛨","Sécurité"]];
 return items.map(([id,ico,label])=>'<button data-tab="'+id+'" class="'+(state.tab===id?"active":"")+'"><span style="display:inline-block;width:24px">'+ico+'</span>'+label+'</button>').join("")
}
function adminShell(content){
 const today=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

 const form=$("#newInterventionForm"),input=$("#addressSearch"),results=$("#addressResults");

 };

 form.onsubmit=async e=>{

   if(!startTime.value||!endTimeHidden.value){alert("Choisis simplement l’heure de début.");startTime.focus();return}
   btn.disabled=true;btn.textContent="Création...";

     if(!chosen){

       }catch(_){}
     }

 }

}
function techProfile(){
 return '<div class="tech-content"><div class="mobile-title"><h2>Mon profil</h2></div><div class="card detail-card"><div style="display:flex;gap:12px;align-items:center"><div class="avatar" style="width:54px;height:54px">'+esc(initials(state.user.name))+'</div><div><strong>'+esc(state.user.name)+'</strong><div class="muted small">'+esc(state.user.email||"")+'</div><div class="badge done" style="margin-top:7px">Technicien actif</div></div></div></div><button class="btn btn-danger" id="techLogoutBtn" style="width:100%">Se déconnecter</button></div>'
}
function techHeader(){
 return '<div class="tech-header"><div class="tech-brandrow"><div class="tech-brand"><div class="brandmark">CN</div><div><strong>Compagnie des Nuisibles</strong><div class="muted tiny">V6 PRO</div></div></div><div class="tech-greeting"><div class="avatar">'+esc(initials(state.user.name))+'</div><div><strong>Bonjour '+esc(state.user.name.split(" ")[0])+'</strong><div class="muted tiny">Technicien sur le terrain</div></div></div></div></div>'
}
function renderTech(){
 let inner=state.techScreen==="planning"?techPlanning():state.techScreen==="interventions"?techInterventions():state.techScreen==="clients"?techClients():state.techScreen==="reports"?techReports():state.techScreen==="profile"?techProfile():state.techScreen.startsWith("detail:")?techDetail(state.techScreen.split(":")[1]):techReport(state.techScreen.split(":")[1]);
 $("#app").innerHTML='<div class="tech-app">'+techHeader()+'<div class="tech-screen active">'+inner+'</div><div class="tech-bottom" style="grid-template-columns:repeat(5,1fr)"><button class="'+(state.techScreen==="planning"?"active":"")+'" id="navPlanning">Planning</button><button class="'+(state.techScreen==="interventions"?"active":"")+'" id="navInterventions">Interventions</button><button class="'+(state.techScreen==="clients"?"active":"")+'" id="navClients">Clients</button><button class="'+(state.techScreen==="reports"?"active":"")+'" id="navReports">Rapports</button><button class="'+(state.techScreen==="profile"?"active":"")+'" id="navProfile">Profil</button></div></div>';
 $$("[data-tech-period]").forEach(b=>b.onclick=()=>{state.techPeriod=b.dataset.techPeriod;renderTech()});
 $$("[data-job]").forEach(b=>b.onclick=()=>{state.techScreen="detail:"+b.dataset.job;renderTech()});
 $$("[data-report-open]").forEach(b=>b.onclick=()=>{state.techScreen="report:"+b.dataset.reportOpen;renderTech()});
 $$("[data-route]").forEach(b=>b.onclick=()=>{const i=state.interventions.find(x=>x.id===b.dataset.route);if(i)showRouteChoices(i)});
 $$("[data-client-route]").forEach(b=>b.onclick=()=>{const client=state.clients.find(x=>x.id===b.dataset.clientRoute);if(client)showRouteChoices({address:client.billing_address})});
 $$("[data-status]").forEach(b=>b.onclick=async()=>{const id=state.techScreen.split(":")[1];b.disabled=true;const {error}=await sb.rpc("update_intervention_status",{p_intervention_id:id,p_status:b.dataset.status});if(error){b.disabled=false;return alert("Statut impossible : "+error.message)}await loadAll();renderTech()});
 if($("#backPlanning"))$("#backPlanning").onclick=()=>{state.techScreen="planning";renderTech()};
 if($("#openReport"))$("#openReport").onclick=()=>{const id=state.techScreen.split(":")[1];state.techScreen="report:"+id;renderTech()};
 if($("#diagnosticOnly"))$("#diagnosticOnly").onclick=()=>{const id=state.techScreen.split(":")[1],i=state.interventions.find(x=>x.id===id);if(i)showDiagnosticModal(i)};
 if($("#backDetail"))$("#backDetail").onclick=()=>{const id=state.techScreen.split(":")[1];state.techScreen="detail:"+id;renderTech()};
 if($("#v6ReportForm"))$("#v6ReportForm").onsubmit=async e=>{e.preventDefault();const id=state.techScreen.split(":")[1],txt=$("#v6ReportText").value.trim();if(!txt)return alert("Renseigne le rapport.");const btn=$("#validateV6Report");btn.disabled=true;btn.textContent="Validation...";const {error}=await sb.rpc("complete_intervention",{p_intervention_id:id,p_report:txt,p_amount:$("#v6Amount").value?Number($("#v6Amount").value):null,p_payment:$("#v6Payment").value||null});if(error){btn.disabled=false;btn.textContent="Valider le rapport";return alert("Validation impossible : "+error.message)}await loadAll();state.techScreen="report:"+id;renderTech()};
 if($("#openPdfLegacy"))$("#openPdfLegacy").onclick=()=>{const id=state.techScreen.split(":")[1];location.href="index.html?pdf="+encodeURIComponent(id)};
 $("#navPlanning").onclick=()=>{state.techScreen="planning";renderTech()};
 $("#navInterventions").onclick=()=>{state.techScreen="interventions";renderTech()};
 $("#navClients").onclick=()=>{state.techScreen="clients";renderTech()};
 $("#navReports").onclick=()=>{state.techScreen="reports";renderTech()};
 $("#navProfile").onclick=()=>{state.techScreen="profile";renderTech()};
 if($("#techLogoutBtn"))$("#techLogoutBtn").onclick=async()=>{await sb.auth.signOut();state.user=null;render()}
}
function render(){
 if(!state.user)return login();
 if(state.user.role==="admin")renderAdmin(); else renderTech()
}
(async()=>{await loadAll();render()})();
</script>
</body>
</html>
